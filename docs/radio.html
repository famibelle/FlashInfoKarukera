<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Radio Karukera — Botiran</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    a.back {
      align-self: flex-start;
      margin-bottom: 1.25rem;
      text-decoration: none;
      color: #555;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.15s;
    }
    a.back:hover { color: #e8e8e8; }

    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 20px;
      padding: 1.75rem 1.5rem;
      max-width: 500px;
      width: 100%;
    }

    /* Header */
    .radio-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
      opacity: 0.3;
    }

    .live-dot.on {
      opacity: 1;
      animation: blink 1.6s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .radio-name {
      font-size: 0.8rem;
      font-weight: 600;
      color: #8b8fa8;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Start screen */
    #start-screen {
      text-align: center;
      padding: 2.5rem 0 1rem;
    }

    .start-emoji { font-size: 3.5rem; margin-bottom: 1.25rem; }

    .start-btn {
      background: #6366f1;
      border: none;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      padding: 0.9rem 2.5rem;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .start-btn:hover { background: #4f46e5; }
    .start-btn:active { transform: scale(0.97); }

    .start-hint {
      margin-top: 0.9rem;
      font-size: 0.82rem;
      color: #555;
      line-height: 1.5;
    }

    /* Player screen */
    #player-screen { display: none; }

    /* YouTube frame */
    #yt-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      margin-bottom: 1.25rem;
    }

    #yt-wrap iframe { width: 100%; height: 100%; display: block; }

    /* Transition overlay */
    #transition-overlay {
      display: none;
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 12px;
      background: linear-gradient(145deg, #1e1b4b, #12131f);
      border: 1px solid #2a2d3a;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    #transition-overlay.on { display: flex; }

    #eq-canvas {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 72px;
      border-radius: 0 0 11px 11px;
      pointer-events: none;
    }

    .tr-icon { font-size: 2.8rem; display: inline-block; will-change: transform; }
    .tr-label {
      font-size: 1rem;
      font-weight: 600;
      color: #a5b4fc;
      text-align: center;
      padding: 0 1rem;
    }
    .tr-timer {
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
      color: #555;
      letter-spacing: 0.04em;
    }

    /* Now playing */
    .now-playing { margin-bottom: 1.25rem; }

    .np-type {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6366f1;
      margin-bottom: 0.2rem;
    }

    .np-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }

    .np-artist { font-size: 0.88rem; color: #8b8fa8; margin-top: 0.15rem; }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .btn-round {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: #6366f1;
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-round:hover { background: #4f46e5; }
    .btn-round:active { transform: scale(0.94); }

    .btn-ghost {
      background: #252836;
      border: 1px solid #333646;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      color: #b0b4cc;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .btn-ghost:hover { background: #2e3245; color: #e8e8e8; }

    .vol-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: auto;
    }

    .vol-icon { font-size: 0.85rem; color: #555; }

    input[type=range] {
      -webkit-appearance: none;
      width: 75px;
      height: 4px;
      border-radius: 2px;
      background: #2a2d3a;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #6366f1;
    }
    /* Seek slider - plus large pour la position audio */
    #seek-slider {
      width: 100%;
      height: 4px;
      margin: 0.5rem 0;
    }
    #seek-slider::-webkit-slider-thumb {
      width: 14px;
      height: 14px;
      background: #ef4444;
    }
    /* Affichage temps écoulé/durée */
    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      font-variant-numeric: tabular-nums;
      color: #555;
      letter-spacing: 0.04em;
      margin-top: 0.25rem;
    }

    /* Queue */
    .queue-section { border-top: 1px solid #2a2d3a; padding-top: 1.25rem; }

    .queue-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #444;
      margin-bottom: 0.75rem;
    }

    .queue-item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.45rem 0;
      border-bottom: 1px solid #1e2030;
      font-size: 0.84rem;
    }
    .queue-item:last-child { border-bottom: none; }

    .qi-icon { font-size: 0.85rem; color: #444; flex-shrink: 0; }
    .qi-info { min-width: 0; }
    .qi-title { color: #b8b8c8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qi-artist { font-size: 0.76rem; color: #555; }

    /* Toggle playlist button */
    .btn-toggle-playlist {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: none;
      border: 1px solid #2a2d3a;
      border-radius: 8px;
      color: #555;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.35rem 0.75rem;
      cursor: pointer;
      margin-top: 0.75rem;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-toggle-playlist:hover { color: #b0b4cc; border-color: #444; }

    /* Full scrollable playlist */
    #full-playlist {
      display: none;
      margin-top: 0.75rem;
      max-height: 320px;
      overflow-y: auto;
      border-top: 1px solid #2a2d3a;
      padding-top: 0.5rem;
    }
    #full-playlist.open { display: block; }

    .pl-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.4rem 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s;
      font-size: 0.82rem;
    }
    .pl-item:hover { background: #252836; }
    .pl-item.pl-current { background: #1e1b4b; }
    .pl-item.pl-current .pl-title { color: #a5b4fc; font-weight: 600; }

    .pl-num { font-size: 0.7rem; color: #444; width: 1.6rem; text-align: right; flex-shrink: 0; }
    .pl-item.pl-current .pl-num { color: #6366f1; }
    .pl-icon { font-size: 0.85rem; flex-shrink: 0; }
    .pl-info { min-width: 0; }
    .pl-title { color: #b8b8c8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl-artist { font-size: 0.74rem; color: #555; }
  </style>
</head>
<body>

  <a class="back" href="index.html">← Botiran</a>

  <div class="card">
    <div class="radio-header">
      <div class="live-dot" id="live-dot"></div>
      <span class="radio-name">Radio Ka-rukera 🐚, la radio de la diaspora au Luxembourg</span>
    </div>

    <!-- ── Start screen ───────────────────────────────────── -->
    <div id="start-screen">
      <div class="start-emoji">📻</div>
      <button class="start-btn" id="start-btn">▶ Allume la radio</button>
      <p class="start-hint">
        Musique caribéenne non-stop<br>
        Flash info · Horoscope · Zouk · Kompa · Gwoka
      </p>
    </div>

    <!-- ── Player screen ──────────────────────────────────── -->
    <div id="player-screen">

      <div id="yt-wrap">
        <div id="yt-player"></div>
      </div>

      <div id="transition-overlay">
        <div class="tr-icon" id="tr-icon">🎙️</div>
        <div class="tr-label" id="tr-label"></div>
        <div class="tr-timer" id="tr-timer"></div>
        <canvas id="eq-canvas"></canvas>
      </div>

      <div class="now-playing">
        <div class="np-type" id="np-type">Musique</div>
        <div class="np-title" id="np-title">Chargement…</div>
        <div class="np-artist" id="np-artist"></div>
      </div>

      <div class="controls">
        <!-- Seek slider pour position audio -->
        <input type="range" id="seek-slider" min="0" max="100" value="0" title="Déplacer dans le morceau">
        <div class="time-display">
          <span id="time-current">0:00</span>
          <span id="time-duration">0:00</span>
        </div>
        <div style="display: flex; align-items: center; gap: 0.75rem; width: 100%;">
          <button class="btn-ghost" id="btn-prev" title="Précédent">⏮</button>
          <button class="btn-round" id="btn-play">⏸</button>
          <button class="btn-ghost" id="btn-skip" title="Passer">⏭</button>
          <div class="vol-wrap">
            <span class="vol-icon">🔊</span>
            <input type="range" id="volume" min="0" max="100" value="80">
          </div>
        </div>
      </div>

      <div class="queue-section">
        <div class="queue-label">À suivre</div>
        <div id="queue-list"></div>
        <button class="btn-toggle-playlist" id="btn-toggle-playlist">
          <span id="toggle-arrow">▼</span> Toute la playlist
        </button>
        <div id="full-playlist"></div>
      </div>

    </div>
  </div>

  <audio id="tr-audio"></audio>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
  // ── RadioOrchestrator ─────────────────────────────────────────────────────────

  class RadioOrchestrator {
    constructor() {
      this.seq     = [];
      this.pos     = 0;
      this.yt      = null;
      this.ytReady = false;
      this.started = false;

      this._playlistOpen = false;
      this._pendingVideo = null;
      this._isSeeking = false;
      this._ytUpdateInterval = null;
      this._eqRaf      = null;
      this._audioCtx   = null;
      this._analyser   = null;
      this._freqData   = null;

      this.trAudio = document.getElementById('tr-audio');
      this.seekSlider = document.getElementById('seek-slider');
      this.timeCurrentEl = document.getElementById('time-current');
      this.timeDurationEl = document.getElementById('time-duration');

      this.trAudio.addEventListener('ended', () => this._next());
      this.trAudio.addEventListener('timeupdate', () => this._updateSeekPosition());
      this.trAudio.addEventListener('loadedmetadata', () => this._updateSeekPosition());
      this.trAudio.addEventListener('durationchange', () => this._updateSeekPosition());

      // Écouteur pour le seek manuel
      if (this.seekSlider) {
        this.seekSlider.addEventListener('input', () => this._seek());
      }

      // Promise résolue quand l'API YT est disponible (callback ou polling)
      this._ytApiReady = new Promise(resolve => {
        window.onYouTubeIframeAPIReady = () => resolve();
        // Polling de secours toutes les 200ms (max 15s)
        let waited = 0;
        const poll = setInterval(() => {
          if (window.YT && window.YT.Player) {
            clearInterval(poll);
            resolve();
          }
          if ((waited += 200) >= 15000) {
            clearInterval(poll);
            resolve();
          }
        }, 200);
      });
    }

    // ── Seek Slider Helpers ─────────────────────────────────────

    _formatTime(seconds) {
      if (!isFinite(seconds) || seconds < 0) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    _updateSeekPosition() {
      // Ne pas mettre à jour pendant un seek manuel pour éviter les boucles
      if (this._isSeeking) return;
      
      const item = this.seq[this.pos];
      if (!item) return;

      if (item.type === 'music' && this.ytReady && this.yt.getPlayerState() !== YT.PlayerState.CUED) {
        // Lecture YouTube
        const current = this.yt.getCurrentTime();
        const duration = this.yt.getDuration();
        if (duration > 0 && !isNaN(current)) {
          const percent = (current / duration) * 100;
          if (this.seekSlider) this.seekSlider.value = percent;
          if (this.timeCurrentEl) this.timeCurrentEl.textContent = this._formatTime(current);
          if (this.timeDurationEl) this.timeDurationEl.textContent = this._formatTime(duration);
        }
      } else {
        // Lecture HTML5 Audio (liners, capsules, transitions)
        if (this.trAudio.duration && !isNaN(this.trAudio.duration)) {
          const percent = (this.trAudio.currentTime / this.trAudio.duration) * 100;
          if (this.seekSlider) this.seekSlider.value = percent;
          if (this.timeCurrentEl) this.timeCurrentEl.textContent = this._formatTime(this.trAudio.currentTime);
          if (this.timeDurationEl) this.timeDurationEl.textContent = this._formatTime(this.trAudio.duration);
        }
      }
    }

    _seek() {
      const item = this.seq[this.pos];
      if (!item || !this.seekSlider) return;

      this._isSeeking = true;
      const percent = parseFloat(this.seekSlider.value) / 100;

      if (item.type === 'music' && this.ytReady) {
        const duration = this.yt.getDuration();
        if (duration > 0) {
          this.yt.seekTo(duration * percent, true);
        }
      } else {
        if (this.trAudio.duration && !isNaN(this.trAudio.duration)) {
          this.trAudio.currentTime = this.trAudio.duration * percent;
        }
      }

      // Réinitialiser le flag après un court délai
      setTimeout(() => { this._isSeeking = false; }, 100);
    }

    // ── Chargement ──────────────────────────────────────────

    async load() {
      try {
        const r    = await fetch('radio_sequence.json?t=' + Date.now());
        const data = await r.json();
        this.seq   = data.sequence || [];
      } catch (e) {
        console.warn('radio_sequence.json introuvable', e);
        this.seq = [];
      }
    }

    // ── YouTube IFrame ───────────────────────────────────────

    _initYT() {
      // Retourne une Promise résolue quand le player est prêt (onReady)
      return new Promise(resolve => {
        this.yt = new YT.Player('yt-player', {
          width: '100%', height: '100%',
          playerVars: { autoplay: 0, controls: 1, rel: 0, modestbranding: 1 },
          events: {
            onReady: () => {
              this.ytReady = true;
              if (this._pendingVideo) {
                this.yt.loadVideoById(this._pendingVideo.videoId);
                this.yt.setVolume(this._pendingVideo.vol);
                this._pendingVideo = null;
              }
              resolve();
            },
            onStateChange: (e) => {
              if (e.data === YT.PlayerState.ENDED) {
                this._next();
              } else if (e.data === YT.PlayerState.PLAYING) {
                // Démarrer le timer de mise à jour du seek slider pendant la lecture YouTube
                this._ytUpdateInterval = setInterval(() => this._updateSeekPosition(), 250);
              } else {
                // Arrêter le timer quand ce n'est plus en lecture
                if (this._ytUpdateInterval) {
                  clearInterval(this._ytUpdateInterval);
                  this._ytUpdateInterval = null;
                }
              }
            },
          },
        });
      });
    }

    // ── Démarrage ────────────────────────────────────────────

    async start() {
      if (this.seq.length === 0) await this.load();
      this.started = true;
      this._initAudioContext();
      this._show();
      // iOS : _playAt(0) avant tout await pour rester dans le contexte du geste utilisateur.
      // Si le premier item est de la musique et YT pas encore prêt, _pendingVideo prend le relais.
      this._playAt(0);

      await this._ytApiReady;
      if (window.YT && window.YT.Player && !this.yt) await this._initYT();
    }

    // ── Séquencement ─────────────────────────────────────────

    _playAt(index) {
      this.pos = ((index % this.seq.length) + this.seq.length) % this.seq.length;
      const item = this.seq[this.pos];

      // Sauter les liners/capsules sans URL (non encore générés)
      if ((item.type === 'liner' || item.type === 'capsule') && !item.url) {
        return this._playAt(this.pos + 1);
      }

      // Arrêter tout ce qui joue avant de passer à l'élément suivant
      this.trAudio.pause();
      if (this.ytReady) this.yt.stopVideo();

      this._updateNowPlaying(item);
      this._renderQueue();
      
      // Réinitialiser le seek slider pour le nouvel élément
      if (this.seekSlider) this.seekSlider.value = 0;
      if (this.timeCurrentEl) this.timeCurrentEl.textContent = '0:00';
      if (this.timeDurationEl) this.timeDurationEl.textContent = '0:00';

      if (item.type === 'music') {
        // Musique → YouTube
        this._showYT();
        if (this.ytReady) {
          this.yt.loadVideoById(item.videoId);
          this.yt.setVolume(this._vol());
        } else {
          // YT pas encore prêt (démarrage rapide) — mémorise pour onReady
          this._pendingVideo = { videoId: item.videoId, vol: this._vol() };
        }
      } else {
        // Liner MP3 + transitions (flash info, horoscope) → HTML5 Audio
        this._showTransition(item);
        this.trAudio.src    = this._resolveUrl(item.url);
        this.trAudio.volume = this._vol() / 100;
        this.trAudio.play().catch(e => console.warn('[audio] échec play:', e.message, '\n  url:', item.url));
      }
    }

    _next() { this._playAt(this.pos + 1); }
    _prev() { this._playAt(this.pos - 1); }

    // Les liners sont co-hébergés avec le player (docs/liners/) — on résout
    // l'URL absolue GitHub Pages en chemin relatif pour que ça marche en local
    // ET sur GitHub Pages sans avoir besoin de pousser d'abord.
    _resolveUrl(url) {
      const base = 'https://famibelle.github.io/FlashInfoKarukera/';
      return url.startsWith(base) ? url.slice(base.length) : url;
    }

    // ── Lecture / pause ──────────────────────────────────────

    togglePlay() {
      const item = this.seq[this.pos];
      if (!item) return;
      if (item.type === 'music' && this.ytReady) {
        const s = this.yt.getPlayerState();
        s === YT.PlayerState.PLAYING ? this.yt.pauseVideo() : this.yt.playVideo();
        btnPlay.textContent = s === YT.PlayerState.PLAYING ? '▶' : '⏸';
      } else {
        this.trAudio.paused ? this.trAudio.play() : this.trAudio.pause();
        btnPlay.textContent = this.trAudio.paused ? '▶' : '⏸';
      }
    }

    setVolume(v) {
      if (this.ytReady) this.yt.setVolume(v);
      this.trAudio.volume = v / 100;
    }

    _vol() { return parseInt(document.getElementById('volume').value); }

    // ── UI ───────────────────────────────────────────────────

    _show() {
      document.getElementById('start-screen').style.display  = 'none';
      document.getElementById('player-screen').style.display = 'block';
      document.getElementById('live-dot').classList.add('on');
    }

    _showYT(isLiner = false) {
      this._stopEQ();
      document.getElementById('yt-wrap').style.display = '';
      document.getElementById('transition-overlay').classList.remove('on');
      document.getElementById('tr-timer').textContent = '';
      // Teinte légère sur le cadre pendant un liner
      document.getElementById('yt-wrap').style.outline =
        isLiner ? '2px solid #6366f144' : 'none';
    }

    _showTransition(item) {
      document.getElementById('yt-wrap').style.display = 'none';
      const ovl = document.getElementById('transition-overlay');
      ovl.classList.add('on');
      document.getElementById('tr-icon').textContent  = item.icon  || '🎙️';
      document.getElementById('tr-label').textContent = item.label || '';
      this._startEQ();
    }

    _updateNowPlaying(item) {
      btnPlay.textContent = '⏸';
      const subtypeLabels = {
        flash_info:   '📰 Flash Info',
        horoscope:    '✨ Horoscope',
        announcement: '🎙️ Annonce',
      };
      if (item.type === 'music') {
        document.getElementById('np-type').textContent   = '🎵 Musique';
        document.getElementById('np-title').textContent  = item.title  || '—';
        document.getElementById('np-artist').textContent = item.artist || '';
      } else if (item.type === 'liner') {
        document.getElementById('np-type').textContent   = '🎙️ Dans un moment…';
        document.getElementById('np-title').textContent  = item.label || 'Annonce à venir';
        document.getElementById('np-artist').textContent = '';
      } else if (item.type === 'capsule') {
        document.getElementById('np-type').textContent   = '🌺 Capsule culturelle';
        document.getElementById('np-title').textContent  = item.label || 'Guadeloupe';
        document.getElementById('np-artist').textContent = '';
      } else {
        document.getElementById('np-type').textContent   = subtypeLabels[item.subtype] || '🎙️';
        document.getElementById('np-title').textContent  = item.label || 'Transition';
        document.getElementById('np-artist').textContent = '';
      }
    }

    _renderQueue() {
      const subtypeIcons = { flash_info: '📰', horoscope: '✨', announcement: '🎙️' };
      const items = Array.from({ length: 5 }, (_, i) => this.seq[(this.pos + 1 + i) % this.seq.length]);
      document.getElementById('queue-list').innerHTML = items.map(it => {
        let icon, title, artist = '';
        if (it.type === 'music') {
          icon   = '🎵';
          title  = it.title  || '—';
          artist = it.artist || '';
        } else if (it.type === 'liner') {
          icon  = '🎙️';
          title = it.label || 'Dans un moment…';
        } else if (it.type === 'capsule') {
          icon  = '🌺';
          title = it.label || 'Capsule culturelle';
        } else {
          icon  = subtypeIcons[it.subtype] || '🎙️';
          title = it.label || 'Transition';
        }
        return `<div class="queue-item">
          <span class="qi-icon">${icon}</span>
          <div class="qi-info">
            <div class="qi-title">${title}</div>
            ${artist ? `<div class="qi-artist">${artist}</div>` : ''}
          </div>
        </div>`;
      }).join('');
      this._renderFullPlaylist();
    }

    _renderFullPlaylist() {
      if (!this._playlistOpen) return;
      const subtypeIcons = { flash_info: '📰', horoscope: '✨', announcement: '🎙️' };
      const el = document.getElementById('full-playlist');
      el.innerHTML = this.seq.map((it, i) => {
        let icon, title, artist = '';
        if (it.type === 'music') {
          icon   = '🎵';
          title  = it.title  || '—';
          artist = it.artist || '';
        } else if (it.type === 'liner') {
          icon  = '🎙️';
          title = it.label || 'Dans un moment…';
        } else if (it.type === 'capsule') {
          icon  = '🌺';
          title = it.label || 'Capsule culturelle';
        } else {
          icon  = subtypeIcons[it.subtype] || '🎙️';
          title = it.label || 'Transition';
        }
        const cur = i === this.pos ? ' pl-current' : '';
        return `<div class="pl-item${cur}" data-idx="${i}">
          <span class="pl-num">${i + 1}</span>
          <span class="pl-icon">${icon}</span>
          <div class="pl-info">
            <div class="pl-title">${title}</div>
            ${artist ? `<div class="pl-artist">${artist}</div>` : ''}
          </div>
        </div>`;
      }).join('');
      const cur = el.querySelector('.pl-current');
      if (cur) cur.scrollIntoView({ block: 'nearest' });
      el.querySelectorAll('.pl-item').forEach(row => {
        row.addEventListener('click', () => this._playAt(parseInt(row.dataset.idx)));
      });
    }
    // ── Égaliseur rétro pixel ─────────────────────────────────────
    _initAudioContext() {
      if (this._audioCtx) { this._audioCtx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this._audioCtx = new AC();
      this._analyser = this._audioCtx.createAnalyser();
      this._analyser.fftSize = 64;
      this._analyser.smoothingTimeConstant = 0.8;
      const src = this._audioCtx.createMediaElementSource(this.trAudio);
      src.connect(this._analyser);
      this._analyser.connect(this._audioCtx.destination);
      this._freqData = new Uint8Array(this._analyser.frequencyBinCount);
    }

    _startEQ() {
      const canvas = document.getElementById('eq-canvas');
      if (!canvas || !this._analyser) return;
      canvas.width  = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;
      const BLOCK  = 4;   // hauteur d'un pixel-bloc
      const VGAP   = 1;   // espace vertical entre blocs
      const BAR_W  = 10;  // largeur d'une barre
      const BAR_GAP = 3;  // espace entre barres
      const N = Math.floor((W * 0.8) / (BAR_W + BAR_GAP)); // 80 % de la largeur
      const maxBlocks = Math.floor(H / (BLOCK + VGAP));

      const trIcon = document.getElementById('tr-icon');

      const draw = () => {
        this._eqRaf = requestAnimationFrame(draw);
        this._analyser.getByteFrequencyData(this._freqData);

        // Énergie basse fréquence (bins 1-6) → pulse de l'emoji
        let bassSum = 0;
        const bassEnd = Math.min(6, this._freqData.length);
        for (let j = 1; j <= bassEnd; j++) bassSum += this._freqData[j];
        const bassAvg = bassSum / bassEnd / 255;
        if (trIcon) trIcon.style.transform = `scale(${(1 + bassAvg * 0.45).toFixed(3)})`;

        // Barres EQ
        ctx.clearRect(0, 0, W, H);
        const totalW = N * (BAR_W + BAR_GAP) - BAR_GAP;
        const startX = (W - totalW) / 2;
        for (let i = 0; i < N; i++) {
          const bin = Math.floor(1 + (i / N) * this._freqData.length * 0.75);
          const val = this._freqData[Math.min(bin, this._freqData.length - 1)] / 255;
          const blocks = Math.round(val * maxBlocks);
          const x = startX + i * (BAR_W + BAR_GAP);
          for (let b = 0; b < blocks; b++) {
            const r = b / maxBlocks;
            ctx.fillStyle = r < 0.55 ? '#22c55e' : r < 0.80 ? '#eab308' : '#ef4444';
            ctx.fillRect(x, H - (b + 1) * (BLOCK + VGAP), BAR_W, BLOCK);
          }
        }
      };
      if (this._eqRaf) cancelAnimationFrame(this._eqRaf);
      draw();
    }

    _stopEQ() {
      if (this._eqRaf) { cancelAnimationFrame(this._eqRaf); this._eqRaf = null; }
      const canvas = document.getElementById('eq-canvas');
      if (canvas) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
      const trIcon = document.getElementById('tr-icon');
      if (trIcon) trIcon.style.transform = '';
    }
  }   // fin RadioOrchestrator

  // ── Bootstrap ─────────────────────────────────────────────────────────────────

  const radio   = new RadioOrchestrator();   // onYouTubeIframeAPIReady posé dans le constructeur
  const btnPlay = document.getElementById('btn-play');

  radio.load();   // préchargement séquence en arrière-plan

  document.getElementById('start-btn').addEventListener('click', () => {
    // iOS Safari : double unlock
    // 1) AudioContext.resume() — persiste après async, débloque tout l'audio du contexte
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) { try { (new AC()).resume(); } catch(_) {} }
    // 2) play() synchrone sur l'élément HTML5 Audio — l'enregistre comme user-activated
    radio.trAudio.volume = 0;
    radio.trAudio.src    = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
    radio.trAudio.play().catch(() => {});
    radio.start();
  });
  btnPlay.addEventListener('click', () => radio.togglePlay());
  document.getElementById('btn-prev').addEventListener('click', () => radio._prev());
  document.getElementById('btn-skip').addEventListener('click', () => radio._next());
  document.getElementById('volume').addEventListener('input', e => radio.setVolume(parseInt(e.target.value)));
  document.getElementById('btn-toggle-playlist').addEventListener('click', () => {
    radio._playlistOpen = !radio._playlistOpen;
    document.getElementById('full-playlist').classList.toggle('open', radio._playlistOpen);
    document.getElementById('toggle-arrow').textContent = radio._playlistOpen ? '▲' : '▼';
    if (radio._playlistOpen) radio._renderFullPlaylist();
  });
  </script>
</body>
</html>
