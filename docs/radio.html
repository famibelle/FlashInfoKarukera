<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Radio Karukera — Botiran</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    a.back {
      align-self: flex-start;
      margin-bottom: 1.25rem;
      text-decoration: none;
      color: #555;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.15s;
    }
    a.back:hover { color: #e8e8e8; }

    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 20px;
      padding: 1.75rem 1.5rem;
      max-width: 500px;
      width: 100%;
    }

    /* Header */
    .radio-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
      opacity: 0.3;
    }

    .live-dot.on {
      opacity: 1;
      animation: blink 1.6s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .radio-name {
      font-size: 0.8rem;
      font-weight: 600;
      color: #8b8fa8;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }



    /* YouTube frame - masqué par défaut, affiché via _showYT() */
    #yt-wrap {
      display: none;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      margin-bottom: 1.25rem;
    }

    #yt-wrap iframe { width: 100%; height: 100%; display: block; }

    /* Transition overlay */
    #transition-overlay {
      display: none;
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 12px;
      background: linear-gradient(145deg, #1e1b4b, #12131f);
      border: 1px solid #2a2d3a;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      cursor: pointer;
      touch-action: none;  /* Désactive le scroll natif pour permettre preventDefault */
    }

    /* YouTube wrap - masqué par défaut, affiché uniquement pour les vidéos */

    #transition-overlay.on { display: flex; }

    .tr-artwork {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    #eq-canvas {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 72px;
      border-radius: 0 0 11px 11px;
      cursor: pointer;
    }

    .tr-icon { font-size: 2.8rem; display: inline-block; will-change: transform; }

    /* ── Mode iframe embarqué ── */
    body.embedded {
      padding: 0;
      background: transparent;
      min-height: unset;
      align-items: stretch;
    }
    body.embedded > .back { display: none; }
    body.embedded > .card {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
      max-width: none;
    }
    .tr-label {
      font-size: 1rem;
      font-weight: 600;
      color: #a5b4fc;
      text-align: center;
      padding: 0 1rem;
    }
    .tr-timer {
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
      color: #a5b4fc;
      letter-spacing: 0.02em;
    }

    /* Now playing */
    .now-playing { margin-bottom: 1.25rem; }

    .np-type {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6366f1;
      margin-bottom: 0.2rem;
    }

    .np-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }

    .np-artist { font-size: 0.88rem; color: #8b8fa8; margin-top: 0.15rem; }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .btn-round {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: #6366f1;
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-round:hover { background: #4f46e5; }
    .btn-round:active { transform: scale(0.94); }

    .btn-ghost {
      background: #252836;
      border: 1px solid #333646;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      color: #b0b4cc;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .btn-ghost:hover { background: #2e3245; color: #e8e8e8; }

    .vol-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: auto;
    }

    .vol-icon { font-size: 0.85rem; color: #555; }

    input[type=range] {
      -webkit-appearance: none;
      width: 75px;
      height: 4px;
      border-radius: 2px;
      background: #2a2d3a;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #6366f1;
    }

    /* Queue */
    .queue-section { border-top: 1px solid #2a2d3a; padding-top: 1.25rem; }

    .queue-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #444;
      margin-bottom: 0.75rem;
    }

    .queue-item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.45rem 0;
      border-bottom: 1px solid #1e2030;
      font-size: 0.84rem;
      cursor: pointer;
      transition: background 0.12s;
    }
    .queue-item:hover { background: #252836; }
    .queue-item:last-child { border-bottom: none; }

    .qi-icon { font-size: 0.85rem; color: #444; flex-shrink: 0; }
    .qi-info { min-width: 0; }
    .qi-title { color: #b8b8c8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qi-artist { font-size: 0.76rem; color: #555; }

    /* Toggle playlist button */
    .btn-toggle-playlist {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: none;
      border: 1px solid #2a2d3a;
      border-radius: 8px;
      color: #555;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.35rem 0.75rem;
      cursor: pointer;
      margin-top: 0.75rem;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-toggle-playlist:hover { color: #b0b4cc; border-color: #444; }

    /* Full scrollable playlist */
    #full-playlist {
      display: none;
      margin-top: 0.75rem;
      max-height: 320px;
      overflow-y: auto;
      border-top: 1px solid #2a2d3a;
      padding-top: 0.5rem;
    }
    #full-playlist.open { display: block; }

    .pl-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.4rem 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s;
      font-size: 0.82rem;
    }
    .pl-item:hover { background: #252836; }
    .pl-item.pl-current { background: #1e1b4b; }
    .pl-item.pl-current .pl-title { color: #a5b4fc; font-weight: 600; }

    .pl-num { font-size: 0.7rem; color: #444; width: 1.6rem; text-align: right; flex-shrink: 0; }
    .pl-item.pl-current .pl-num { color: #6366f1; }
    .pl-icon { font-size: 0.85rem; flex-shrink: 0; }
    .pl-info { min-width: 0; }
    .pl-title { color: #b8b8c8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl-artist { font-size: 0.74rem; color: #555; }

    /* Overlay de bienvenue avec bouton Play animé */
    #welcome-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 100;
      border-radius: 12px;
      cursor: pointer;
    }

    .welcome-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: white;
      border: none;
      font-size: 2.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      animation: welcomePulse 2s ease-in-out infinite;
      transition: transform 0.15s, box-shadow 0.15s;
      outline: none;
    }

    .welcome-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
      animation: none; /* Arrête la pulsation au survol pour un effet propre */
    }

    .welcome-btn:active {
      transform: scale(0.95);
    }

    .welcome-text {
      color: white;
      font-size: 1.2rem;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.02em;
    }

    @keyframes welcomePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Fix : s'assurer que l'overlay est au-dessus des autres éléments du player */
    #player-screen {
      position: relative;
    }

    /* Section liens sociaux */
    .social-section {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      max-width: 500px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #252836;
      border: 1px solid #333646;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      color: #e8e8e8;
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .social-btn:hover {
      background: #2e3245;
      border-color: #4a4f6a;
    }

    .social-icon { font-size: 1.4rem; flex-shrink: 0; }
    .social-text { display: flex; flex-direction: column; text-align: left; }
    .social-label { display: block; color: #fff; }
    .social-sub { display: block; font-size: 0.8rem; color: #8b8fa8; margin-top: 2px; }
    .social-arrow { margin-left: auto; color: #555; font-size: 0.9rem; }
  </style>

  <audio id="tr-audio"></audio>

  <script>
  // ── Charger YouTube IFrame API dynamiquement (pour éviter les problèmes d'ordre de chargement) ───
  // Le callback doit être défini AVANT que le script YouTube ne se charge
  
  window._ytResolve = null;
  
  const ytApiPromise = new Promise(resolve => {
    // Si déjà disponible, résoudre tout de suite
    if (window.YT && window.YT.Player) {
      return resolve();
    }
    // Sinon, attendre le callback
    window.onYouTubeIframeAPIReady = () => {
      if (window._ytResolve) window._ytResolve();
      resolve();
    };
    window._ytResolve = resolve;
    
    // Polling de secours toutes les 200ms (max 15s) au cas où le callback ne serait pas appelé
    let waited = 0;
    const poll = setInterval(() => {
      if (window.YT && window.YT.Player) {
        clearInterval(poll);
        resolve();
      }
      if ((waited += 200) >= 15000) {
        clearInterval(poll);
        console.warn('[YT] API non chargée après 15s');
        resolve();
      }
    }, 200);
  });
  
  // Charger le script YouTube dynamiquement (UNIQUEMENT si pas déjà chargé)
  if (!window.YT || !window.YT.Player) {
    (function() {
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      const firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    })();
  }

  // ── RadioOrchestrator ─────────────────────────────────────────────────────────

  class RadioOrchestrator {
    constructor() {
      this.seq     = [];
      this.pos     = 0;
      this.yt      = null;
      this.ytReady = false;
      this.started = false;

      this._playlistOpen = false;
      this._pendingVideo = null;
      this._eqRaf      = null;
      this._audioCtx   = null;
      this._analyser   = null;
      this._freqData   = null;

      this.trAudio = document.getElementById('tr-audio');
      this.trAudio.addEventListener('ended', () => this._next());
      this.trAudio.addEventListener('error', () => {
        if (this.trAudio.error) this._next();
      });
      this.trAudio.addEventListener('timeupdate', () => this._updateTimer());
      this.trAudio.addEventListener('loadedmetadata', () => this._updateTimer());

      // Utiliser la promesse globale ytApiPromise (déjà initialisée avant ce script)
      this._ytApiReady = ytApiPromise;
    }

    // ── Seek Slider Helpers ─────────────────────────────────────

    // ── Chargement ──────────────────────────────────────────

    async load() {
      try {
        // radio_sequence.json et radio.html sont tous les deux dans docs/
        // GitHub Pages les déploie à la racine, donc chemin relatif fonctionne
        const r    = await fetch('radio_sequence.json?t=' + Date.now());
        const data = await r.json();
        this.seq   = data.sequence || [];
      } catch (e) {
        console.warn('radio_sequence.json introuvable', e);
        this.seq = [];
      }
    }

    // ── YouTube IFrame ───────────────────────────────────────

    _initYT() {
      // Retourne une Promise résolue quand le player est prêt (onReady)
      return new Promise(resolve => {
        this.yt = new YT.Player('yt-player', {
          width: '100%', height: '100%',
          playerVars: { 
            autoplay: 0, 
            controls: 1, 
            rel: 0, 
            modestbranding: 1,
            enablejsapi: 1  // Active l'API JavaScript
          },
          events: {
            onReady: () => {
              this.ytReady = true;
              if (this._pendingVideo) {
                this.yt.loadVideoById(this._pendingVideo.videoId);
                this.yt.setVolume(this._pendingVideo.vol);
                this._pendingVideo = null;
              }
              resolve();
            },
            onStateChange: (e) => {
              if (e.data === YT.PlayerState.ENDED) {
                this._next();
              }
            },
          },
        });
      });
    }

    // ── Démarrage ────────────────────────────────────────────

    async start() {
      if (this.seq.length === 0) await this.load();
      this.started = true;
      this._initAudioContext();
      this._show();
      // iOS : _playAt(0) avant tout await pour rester dans le contexte du geste utilisateur.
      // Si le premier item est de la musique et YT pas encore prêt, _pendingVideo prend le relais.
      this._playAt(0);

      await this._ytApiReady;
      if (window.YT && window.YT.Player && !this.yt) await this._initYT();
    }

    // ── Séquencement ─────────────────────────────────────────

    _playAt(index) {
      this.pos = ((index % this.seq.length) + this.seq.length) % this.seq.length;
      const item = this.seq[this.pos];

      // Sauter les liners/capsules sans URL (non encore générés)
      if ((item.type === 'liner' || item.type === 'capsule') && !item.url) {
        return this._playAt(this.pos + 1);
      }

      // Arrêter tout ce qui joue avant de passer à l'élément suivant
      this.trAudio.pause();
      if (this.ytReady) this.yt.stopVideo();

      this._updateNowPlaying(item);
      this._renderQueue();
      

      if (item.type === 'music') {
        // Musique → YouTube
        this._showYT();
        if (this.ytReady) {
          this.yt.loadVideoById(item.videoId);
          this.yt.setVolume(this._vol());
        } else if (this.yt) {
          // YT existe mais onReady pas encore appelé — charger quand prêt
          this._pendingVideo = { videoId: item.videoId, vol: this._vol() };
        } else {
          // YT pas encore initialisé — initialiser et charger
          this._pendingVideo = { videoId: item.videoId, vol: this._vol() };
          this._ytApiReady.then(() => {
            if (window.YT && window.YT.Player && !this.yt) {
              return this._initYT();
            }
          });
        }
      } else {
        // Liner MP3 + transitions (flash info, horoscope) → HTML5 Audio
        // iOS Safari : s'assurer que AudioContext est initialisé
        this._initAudioContext();
        this._showTransition(item);
        this.trAudio.src    = this._resolveUrl(item.url);
        this.trAudio.volume = this._vol() / 100;
        this.trAudio.play().catch(e => console.warn('[audio] échec play:', e.message, '\n  url:', item.url));
      }
    }

    _next() { this._playAt(this.pos + 1); }
    _prev() { this._playAt(this.pos - 1); }

    // Les liners sont co-hébergés avec le player (docs/liners/) — on résout
    // l'URL absolue GitHub Pages en chemin relatif pour que ça marche en local
    // ET sur GitHub Pages sans avoir besoin de pousser d'abord.
    _resolveUrl(url) {
      const base = 'https://famibelle.github.io/FlashInfoKarukera/';
      return url.startsWith(base) ? url.slice(base.length) : url;
    }

    // ── Lecture / pause ──────────────────────────────────────

    togglePlay() {
      const item = this.seq[this.pos];
      if (!item) return;
      
      if (item.type === 'music') {
        // Musique → gérer via YouTube
        if (this.ytReady) {
          const s = this.yt.getPlayerState();
          s === YT.PlayerState.PLAYING ? this.yt.pauseVideo() : this.yt.playVideo();
          btnPlay.textContent = s === YT.PlayerState.PLAYING ? '▶' : '⏸';
        } else {
          // YT pas encore prêt — afficher le player et initialiser si nécessaire
          this._showYT();
          if (this.yt) {
            // YT existe mais pas encore prêt (onReady pas encore appelé)
            // La vidéo sera chargée quand onReady sera déclenché (via _pendingVideo)
            btnPlay.textContent = '⏸';
          } else {
            // YT n'existe pas encore — initialiser
            this._ytApiReady.then(() => {
              if (window.YT && window.YT.Player && !this.yt) {
                return this._initYT();
              }
            }).then(() => {
              // Une fois YT initialisé, charger et jouer la vidéo
              if (this.ytReady) {
                this.yt.loadVideoById(item.videoId);
                this.yt.setVolume(this._vol());
                this.yt.playVideo();
                btnPlay.textContent = '⏸';
              }
            });
          }
        }
      } else {
        // Liner MP3 + transitions (flash info, horoscope) → HTML5 Audio
        this._initAudioContext();
        if (item.type !== 'music') {
          this._showTransition(item);
        }
        if (this.trAudio.paused) {
          this.trAudio.play().catch(e => console.warn('[audio] échec play:', e));
        } else {
          this.trAudio.pause();
        }
        btnPlay.textContent = this.trAudio.paused ? '▶' : '⏸';
      }
    }

    setVolume(v) {
      if (this.ytReady) this.yt.setVolume(v);
      this.trAudio.volume = v / 100;
    }

    _vol() { return parseInt(document.getElementById('volume').value); }

    // ── Timer display ───────────────────────────────────────
    _formatTime(seconds) {
      if (!seconds || !isFinite(seconds)) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    _updateTimer() {
      const current = this.trAudio.currentTime;
      const duration = this.trAudio.duration;
      if (duration && isFinite(duration)) {
        const currentStr = this._formatTime(current);
        const durationStr = this._formatTime(duration);
        document.getElementById('tr-timer').textContent = `${currentStr}/${durationStr}`;
      } else {
        document.getElementById('tr-timer').textContent = '';
      }
    }

    // ── UI ───────────────────────────────────────────────────

    // Helper pour extraire date et moment depuis item.label
    _extractDateAndMoment(item) {
      const monthNames = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
      const now = new Date();
      let dateStr = `${now.getDate()} ${monthNames[now.getMonth()]}`;
      let moment = 'matin';

      if (item.label) {
        // Extraire la date (format YYYY-MM-DD)
        const dateMatch = item.label.match(/(\d{4})-(\d{2})-(\d{2})/);
        if (dateMatch) {
          const day = parseInt(dateMatch[3], 10);
          const monthIndex = parseInt(dateMatch[2]) - 1;
          dateStr = `${day} ${monthNames[monthIndex]}`;
        }
        
        // Extraire le moment (matin, midi, soir)
        if (item.label.includes('soir')) moment = 'soir';
        else if (item.label.includes('midi')) moment = 'midi';
      }
      
      return { dateStr, moment };
    }

    _show() {
      document.getElementById('player-screen').style.display = 'block';
      document.getElementById('live-dot').classList.add('on');
    }

    _showYT(isLiner = false) {
      this._stopEQ();
      document.getElementById('yt-wrap').style.display = 'block';
      document.getElementById('transition-overlay').classList.remove('on');
      document.getElementById('tr-timer').textContent = '';
      // Teinte légère sur le cadre pendant un liner
      document.getElementById('yt-wrap').style.outline =
        isLiner ? '2px solid #6366f144' : 'none';
    }

    _showTransition(item) {
      document.getElementById('yt-wrap').style.display = 'none';
      const ovl = document.getElementById('transition-overlay');
      ovl.classList.add('on');
      document.getElementById('tr-icon').textContent  = item.icon  || '🎙️';
      document.getElementById('tr-label').textContent = item.label || '';
      this._startEQ();
      // Initialiser le timer pour les MP3
      this._updateTimer();
    }

    _updateNowPlaying(item) {
      btnPlay.textContent = '⏸';
      if (item.type === 'music') {
        document.getElementById('np-type').textContent   = '🎵 Musique';
        document.getElementById('np-title').textContent  = item.title  || '—';
        document.getElementById('np-artist').textContent = item.artist || '';
      } else if (item.type === 'liner') {
        document.getElementById('np-type').textContent   = '🎙️ Dans un moment…';
        document.getElementById('np-title').textContent  = item.label || 'Annonce à venir';
        document.getElementById('np-artist').textContent = '';
      } else if (item.type === 'capsule') {
        document.getElementById('np-type').textContent   = '🌺 Capsule culturelle';
        document.getElementById('np-title').textContent  = item.label || 'Guadeloupe';
        document.getElementById('np-artist').textContent = '';
      } else {
        // Formatage personnalisé pour flash_info et horoscope
        if (item.subtype === 'flash_info') {
          const { dateStr, moment } = this._extractDateAndMoment(item);
          document.getElementById('np-type').textContent   = '📰 Votre Flash Info';
          document.getElementById('np-title').textContent  = `du ${dateStr} ${moment} en Guadeloupe`;
          document.getElementById('np-artist').textContent = '';
        } else if (item.subtype === 'horoscope') {
          const { dateStr, moment } = this._extractDateAndMoment(item);
          document.getElementById('np-type').textContent   = '✨ Votre Horoscope';
          document.getElementById('np-title').textContent  = `de ce ${moment} du ${dateStr}`;
          document.getElementById('np-artist').textContent = '';
        } else {
          document.getElementById('np-type').textContent   = '🎙️';
          document.getElementById('np-title').textContent  = item.label || 'Transition';
          document.getElementById('np-artist').textContent = '';
        }
      }
    }

    _renderQueue() {
      const subtypeIcons = { flash_info: '📰', horoscope: '✨', announcement: '🎙️' };
      const items = Array.from({ length: 5 }, (_, i) => this.seq[(this.pos + 1 + i) % this.seq.length]);
      document.getElementById('queue-list').innerHTML = items.map((it, i) => {
        let icon, title, artist = '';
        const targetIdx = (this.pos + 1 + i) % this.seq.length;
        if (it.type === 'music') {
          icon   = '🎵';
          title  = it.title  || '—';
          artist = it.artist || '';
        } else if (it.type === 'liner') {
          icon  = '🎙️';
          title = it.label || 'Dans un moment…';
        } else if (it.type === 'capsule') {
          icon  = '🌺';
          title = it.label || 'Capsule culturelle';
        } else {
          icon  = subtypeIcons[it.subtype] || '🎙️';
          title = it.label || 'Transition';
        }
        return `<div class="queue-item" data-idx="${targetIdx}">
          <span class="qi-icon">${icon}</span>
          <div class="qi-info">
            <div class="qi-title">${title}</div>
            ${artist ? `<div class="qi-artist">${artist}</div>` : ''}
          </div>
        </div>`;
      }).join('');
      // Ajouter écouteurs clic sur les éléments de la queue
      document.querySelectorAll('#queue-list .queue-item').forEach(row => {
        row.addEventListener('click', () => this._playAt(parseInt(row.dataset.idx)));
      });
      this._renderFullPlaylist();
    }

    _renderFullPlaylist() {
      if (!this._playlistOpen) return;
      const subtypeIcons = { flash_info: '📰', horoscope: '✨', announcement: '🎙️' };
      const el = document.getElementById('full-playlist');
      el.innerHTML = this.seq.map((it, i) => {
        let icon, title, artist = '';
        if (it.type === 'music') {
          icon   = '🎵';
          title  = it.title  || '—';
          artist = it.artist || '';
        } else if (it.type === 'liner') {
          icon  = '🎙️';
          title = it.label || 'Dans un moment…';
        } else if (it.type === 'capsule') {
          icon  = '🌺';
          title = it.label || 'Capsule culturelle';
        } else {
          icon  = subtypeIcons[it.subtype] || '🎙️';
          title = it.label || 'Transition';
        }
        const cur = i === this.pos ? ' pl-current' : '';
        return `<div class="pl-item${cur}" data-idx="${i}">
          <span class="pl-num">${i + 1}</span>
          <span class="pl-icon">${icon}</span>
          <div class="pl-info">
            <div class="pl-title">${title}</div>
            ${artist ? `<div class="pl-artist">${artist}</div>` : ''}
          </div>
        </div>`;
      }).join('');
      const cur = el.querySelector('.pl-current');
      if (cur) cur.scrollIntoView({ block: 'nearest' });
      el.querySelectorAll('.pl-item').forEach(row => {
        row.addEventListener('click', () => this._playAt(parseInt(row.dataset.idx)));
      });
    }
    // ── Égaliseur rétro pixel ─────────────────────────────────────
    _initAudioContext() {
      if (this._audioCtx) { this._audioCtx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this._audioCtx = new AC();
      this._analyser = this._audioCtx.createAnalyser();
      this._analyser.fftSize = 256;
      this._analyser.smoothingTimeConstant = 0.8;
      const src = this._audioCtx.createMediaElementSource(this.trAudio);
      src.connect(this._analyser);
      this._analyser.connect(this._audioCtx.destination);
      this._freqData = new Uint8Array(this._analyser.fftSize);
    }

    _startEQ() {
      const canvas = document.getElementById('eq-canvas');
      if (!canvas || !this._analyser) return;
      canvas.width  = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;
      const ZONE_W  = W * 0.8;
      const ORIG_X  = (W - ZONE_W) / 2;
      this._eqOrigX = ORIG_X;
      this._eqZoneW = ZONE_W;
      this._eqCanvas = canvas;
      const MID_Y   = H / 2;
      const DOT_W   = 3;   // largeur pixel-bloc
      const DOT_H   = 4;   // hauteur pixel-bloc
      const samples = this._freqData.length; // 256

      const trIcon = document.getElementById('tr-icon');

      const draw = () => {
        this._eqRaf = requestAnimationFrame(draw);
        this._analyser.getByteTimeDomainData(this._freqData);

        // RMS → pulse de l'emoji
        let rms = 0;
        for (let j = 0; j < samples; j++) {
          const v = (this._freqData[j] / 128) - 1;
          rms += v * v;
        }
        rms = Math.sqrt(rms / samples);
        if (trIcon) trIcon.style.transform = `scale(${(1 + rms * 0.9).toFixed(3)})`;

        // Waveform
        ctx.clearRect(0, 0, W, H);
        // ligne centrale en fond
        ctx.fillStyle = '#2a2d3a';
        ctx.fillRect(ORIG_X, MID_Y - 1, ZONE_W, 2);

        for (let i = 0; i < samples; i++) {
          const x  = ORIG_X + (i / (samples - 1)) * ZONE_W;
          const v  = (this._freqData[i] / 128.0) - 1.0;  // -1 .. +1
          const y  = MID_Y + v * (MID_Y - 6);
          const dev = Math.abs(v);
          ctx.fillStyle = dev < 0.3 ? '#22c55e' : dev < 0.65 ? '#eab308' : '#ef4444';
          ctx.fillRect(Math.round(x) - 1, Math.round(y) - DOT_H / 2, DOT_W, DOT_H);
        }

        // Point rouge de progression
        const dur = this.trAudio.duration;
        if (dur && isFinite(dur)) {
          const dotX = ORIG_X + (this.trAudio.currentTime / dur) * ZONE_W;
          ctx.beginPath();
          ctx.arc(dotX, MID_Y, 5, 0, Math.PI * 2);
          ctx.fillStyle = '#ef4444';
          ctx.fill();
        }
      };
      const seek = (clientX) => {
        const dur = this.trAudio.duration;
        if (!dur || !isFinite(dur)) return;
        const rect  = canvas.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, ((clientX - rect.left) * (W / rect.width) - ORIG_X) / ZONE_W));
        this.trAudio.currentTime = ratio * dur;
      };

      let dragging = false;
      canvas.addEventListener('mousedown',  (e) => { dragging = true;  seek(e.clientX); });
      canvas.addEventListener('touchstart', (e) => { dragging = true;  seek(e.touches[0].clientX); }, { passive: true });
      this._eqMoveHandler = (e) => { if (dragging) seek(e.touches ? e.touches[0].clientX : e.clientX); };
      this._eqUpHandler   = () => { dragging = false; };
      window.addEventListener('mousemove',  this._eqMoveHandler);
      window.addEventListener('touchmove',  this._eqMoveHandler, { passive: true });
      window.addEventListener('mouseup',    this._eqUpHandler);
      window.addEventListener('touchend',   this._eqUpHandler);

      if (this._eqRaf) cancelAnimationFrame(this._eqRaf);
      draw();
    }

    _stopEQ() {
      if (this._eqRaf) { cancelAnimationFrame(this._eqRaf); this._eqRaf = null; }
      const canvas = document.getElementById('eq-canvas');
      if (canvas) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
      if (this._eqMoveHandler) { window.removeEventListener('mousemove', this._eqMoveHandler); window.removeEventListener('touchmove', this._eqMoveHandler); this._eqMoveHandler = null; }
      if (this._eqUpHandler)   { window.removeEventListener('mouseup',   this._eqUpHandler);   window.removeEventListener('touchend',  this._eqUpHandler);   this._eqUpHandler   = null; }
      const trIcon = document.getElementById('tr-icon');
      if (trIcon) trIcon.style.transform = '';
    }
  }   // fin RadioOrchestrator

  // ── Bootstrap ─────────────────────────────────────────────────────────────────

  const radio   = new RadioOrchestrator();   // onYouTubeIframeAPIReady posé dans le constructeur
  const btnPlay = document.getElementById('btn-play');

  // Initialiser le player avec le premier track en pause
  radio.load().then(() => {
    // iOS Safari : AudioContext sera initialisé à la première interaction utilisateur
    // (dans togglePlay ou _playAt pour les MP3)
    
    // Démarrer avec le premier track en pause
    radio.started = true;
    radio.pos = 0;
    const firstItem = radio.seq[0];
    if (firstItem) {
      // Charger le premier track mais ne pas le jouer
      radio._updateNowPlaying(firstItem);
      radio._renderQueue();
      
      // Initialiser YouTube (toujours, quel que soit le premier item)
      radio._ytApiReady.then(() => {
        if (window.YT && window.YT.Player && !radio.yt) {
          return radio._initYT();
        }
      });

      // Charger l'audio pour le premier track
      if (firstItem.type === 'music') {
        radio._showYT();
        radio._ytApiReady.then(() => {
          if (radio.ytReady) {
            radio.yt.loadVideoById(firstItem.videoId);
            radio.yt.pauseVideo();
          }
        });
      } else {
        // Ne pas afficher la transition au chargement (évite l'AudioContext sans geste)
        // La transition s'affichera quand l'utilisateur cliquera sur play
        radio.trAudio.src = radio._resolveUrl(firstItem.url);
        radio.trAudio.volume = radio._vol() / 100;
        radio.trAudio.pause();
      }
      
      // Mettre en pause par défaut
      btnPlay.textContent = '▶';
    }
    radio._show();
  });

  btnPlay.addEventListener('click', () => radio.togglePlay());
  document.getElementById('btn-prev').addEventListener('click', () => radio._prev());
  document.getElementById('btn-skip').addEventListener('click', () => radio._next());
  document.getElementById('volume').addEventListener('input', e => radio.setVolume(parseInt(e.target.value)));
  
  // Rendre toute la transition-overlay cliquable pour play/pause (sauf le canvas)
  const transitionOverlay = document.getElementById('transition-overlay');
  const eqCanvas = document.getElementById('eq-canvas');
  transitionOverlay.addEventListener('click', (e) => {
    if (e.target === eqCanvas) return; // Laisser le seek sur le canvas
    radio.togglePlay();
  });

  // ── Swipe pour changer de piste ─────────────────────────────────────
  let touchStartX = 0;
  let touchStartY = 0;
  const SWIPE_THRESHOLD = 50;

  transitionOverlay.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  });

  transitionOverlay.addEventListener('touchmove', (e) => {
    const touch = e.touches[0];
    const diffX = Math.abs(touch.clientX - touchStartX);
    const diffY = Math.abs(touch.clientY - touchStartY);
    // Empêcher le scroll si mouvement horizontal dominant
    if (diffX > diffY && diffX > 10) {
      e.preventDefault();
    }
  });

  transitionOverlay.addEventListener('touchend', (e) => {
    if (!touchStartX) return;
    const touchEndX = e.changedTouches[0].clientX;
    const diffX = touchStartX - touchEndX; // >0 = swipe gauche, <0 = swipe droite
    if (Math.abs(diffX) > SWIPE_THRESHOLD) {
      if (diffX > 0) {
        radio._next(); // Swipe gauche → piste suivante
      } else {
        radio._prev(); // Swipe droite → piste précédente
      }
    }
    touchStartX = 0;
    touchStartY = 0;
  });

  document.getElementById('btn-toggle-playlist').addEventListener('click', () => {
    radio._playlistOpen = !radio._playlistOpen;
    document.getElementById('full-playlist').classList.toggle('open', radio._playlistOpen);
    document.getElementById('toggle-arrow').textContent = radio._playlistOpen ? '▲' : '▼';
    if (radio._playlistOpen) radio._renderFullPlaylist();
  });

  // Mode embarqué : retire fond et padding quand chargé dans un iframe
  if (window.self !== window.top) document.body.classList.add('embedded');

  // ── Overlay de bienvenue ────────────────────────────────────────────
  const welcomeOverlay = document.getElementById('welcome-overlay');
  const welcomePlayBtn = document.getElementById('welcome-play-btn');

  welcomePlayBtn.addEventListener('click', (e) => {
    e.stopPropagation(); // Empêche le clic de remonter sur d'autres éléments
    welcomeOverlay.style.display = 'none'; // Masque l'overlay
    radio.togglePlay(); // Lance la lecture du premier item (MP3 ou YouTube)
  });

  // Optionnel : masquer aussi si on clique sur le texte
  welcomeOverlay.querySelector('.welcome-text').addEventListener('click', (e) => {
    e.stopPropagation();
    welcomeOverlay.style.display = 'none';
    radio.togglePlay();
  });
  </script>
</body>
</html>
