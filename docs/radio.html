<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Radio Karukera — Botiran</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    a.back {
      align-self: flex-start;
      margin-bottom: 1.25rem;
      text-decoration: none;
      color: #555;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.15s;
    }
    a.back:hover { color: #e8e8e8; }

    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 20px;
      padding: 1.75rem 1.5rem;
      max-width: 500px;
      width: 100%;
    }

    /* Header */
    .radio-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
      opacity: 0.3;
    }

    .live-dot.on {
      opacity: 1;
      animation: blink 1.6s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .radio-name {
      font-size: 0.8rem;
      font-weight: 600;
      color: #8b8fa8;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Start screen */
    #start-screen {
      text-align: center;
      padding: 2.5rem 0 1rem;
    }

    .start-emoji { font-size: 3.5rem; margin-bottom: 1.25rem; }

    .start-btn {
      background: #6366f1;
      border: none;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      padding: 0.9rem 2.5rem;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .start-btn:hover { background: #4f46e5; }
    .start-btn:active { transform: scale(0.97); }

    .start-hint {
      margin-top: 0.9rem;
      font-size: 0.82rem;
      color: #555;
      line-height: 1.5;
    }

    /* Player screen */
    #player-screen { display: none; }

    /* YouTube frame */
    #yt-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      margin-bottom: 1.25rem;
    }

    #yt-wrap iframe { width: 100%; height: 100%; display: block; }

    /* Transition overlay */
    #transition-overlay {
      display: none;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 12px;
      background: linear-gradient(145deg, #1e1b4b, #12131f);
      border: 1px solid #2a2d3a;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    #transition-overlay.on { display: flex; }

    .tr-icon { font-size: 2.8rem; }
    .tr-label {
      font-size: 1rem;
      font-weight: 600;
      color: #a5b4fc;
      text-align: center;
      padding: 0 1rem;
    }

    /* Now playing */
    .now-playing { margin-bottom: 1.25rem; }

    .np-type {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6366f1;
      margin-bottom: 0.2rem;
    }

    .np-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }

    .np-artist { font-size: 0.88rem; color: #8b8fa8; margin-top: 0.15rem; }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .btn-round {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: #6366f1;
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-round:hover { background: #4f46e5; }
    .btn-round:active { transform: scale(0.94); }

    .btn-ghost {
      background: #252836;
      border: 1px solid #333646;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      color: #b0b4cc;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .btn-ghost:hover { background: #2e3245; color: #e8e8e8; }

    .vol-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: auto;
    }

    .vol-icon { font-size: 0.85rem; color: #555; }

    input[type=range] {
      -webkit-appearance: none;
      width: 75px;
      height: 4px;
      border-radius: 2px;
      background: #2a2d3a;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #6366f1;
    }

    /* Queue */
    .queue-section { border-top: 1px solid #2a2d3a; padding-top: 1.25rem; }

    .queue-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #444;
      margin-bottom: 0.75rem;
    }

    .queue-item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.45rem 0;
      border-bottom: 1px solid #1e2030;
      font-size: 0.84rem;
    }
    .queue-item:last-child { border-bottom: none; }

    .qi-icon { font-size: 0.85rem; color: #444; flex-shrink: 0; }
    .qi-info { min-width: 0; }
    .qi-title { color: #b8b8c8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qi-artist { font-size: 0.76rem; color: #555; }

    /* Toggle playlist button */
    .btn-toggle-playlist {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: none;
      border: 1px solid #2a2d3a;
      border-radius: 8px;
      color: #555;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.35rem 0.75rem;
      cursor: pointer;
      margin-top: 0.75rem;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-toggle-playlist:hover { color: #b0b4cc; border-color: #444; }

    /* Full scrollable playlist */
    #full-playlist {
      display: none;
      margin-top: 0.75rem;
      max-height: 320px;
      overflow-y: auto;
      border-top: 1px solid #2a2d3a;
      padding-top: 0.5rem;
    }
    #full-playlist.open { display: block; }

    .pl-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.4rem 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s;
      font-size: 0.82rem;
    }
    .pl-item:hover { background: #252836; }
    .pl-item.pl-current { background: #1e1b4b; }
    .pl-item.pl-current .pl-title { color: #a5b4fc; font-weight: 600; }

    .pl-num { font-size: 0.7rem; color: #444; width: 1.6rem; text-align: right; flex-shrink: 0; }
    .pl-item.pl-current .pl-num { color: #6366f1; }
    .pl-icon { font-size: 0.85rem; flex-shrink: 0; }
    .pl-info { min-width: 0; }
    .pl-title { color: #b8b8c8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl-artist { font-size: 0.74rem; color: #555; }
  </style>
</head>
<body>

  <a class="back" href="index.html">← Botiran</a>

  <div class="card">
    <div class="radio-header">
      <div class="live-dot" id="live-dot"></div>
      <span class="radio-name">Radio Karukera</span>
    </div>

    <!-- ── Start screen ───────────────────────────────────── -->
    <div id="start-screen">
      <div class="start-emoji">📻</div>
      <button class="start-btn" id="start-btn">▶ Allume la radio</button>
      <p class="start-hint">
        Musique caribéenne non-stop<br>
        Flash info · Horoscope · Zouk · Kompa · Gwoka
      </p>
    </div>

    <!-- ── Player screen ──────────────────────────────────── -->
    <div id="player-screen">

      <div id="yt-wrap">
        <div id="yt-player"></div>
      </div>

      <div id="transition-overlay">
        <div class="tr-icon" id="tr-icon">🎙️</div>
        <div class="tr-label" id="tr-label"></div>
      </div>

      <div class="now-playing">
        <div class="np-type" id="np-type">Musique</div>
        <div class="np-title" id="np-title">Chargement…</div>
        <div class="np-artist" id="np-artist"></div>
      </div>

      <div class="controls">
        <button class="btn-ghost" id="btn-prev" title="Précédent">⏮</button>
        <button class="btn-round" id="btn-play">⏸</button>
        <button class="btn-ghost" id="btn-skip" title="Passer">⏭</button>
        <div class="vol-wrap">
          <span class="vol-icon">🔊</span>
          <input type="range" id="volume" min="0" max="100" value="80">
        </div>
      </div>

      <div class="queue-section">
        <div class="queue-label">À suivre</div>
        <div id="queue-list"></div>
        <button class="btn-toggle-playlist" id="btn-toggle-playlist">
          <span id="toggle-arrow">▼</span> Toute la playlist
        </button>
        <div id="full-playlist"></div>
      </div>

    </div>
  </div>

  <audio id="tr-audio"></audio>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
  // ── RadioOrchestrator ─────────────────────────────────────────────────────────

  class RadioOrchestrator {
    constructor() {
      this.seq     = [];
      this.pos     = 0;
      this.yt      = null;
      this.ytReady = false;
      this.started = false;

      this._playlistOpen = false;

      this.trAudio = document.getElementById('tr-audio');
      this.trAudio.addEventListener('ended', () => this._next());

      // Promise résolue quand l'API YT est disponible (callback ou polling)
      this._ytApiReady = new Promise(resolve => {
        window.onYouTubeIframeAPIReady = () => resolve();
        // Polling de secours toutes les 200ms (max 15s)
        let waited = 0;
        const poll = setInterval(() => {
          if (window.YT && window.YT.Player) {
            clearInterval(poll);
            resolve();
          }
          if ((waited += 200) >= 15000) {
            clearInterval(poll);
            resolve();
          }
        }, 200);
      });
    }

    // ── Chargement ──────────────────────────────────────────

    async load() {
      try {
        const r    = await fetch('radio_sequence.json?t=' + Date.now());
        const data = await r.json();
        this.seq   = data.sequence || [];
      } catch (e) {
        console.warn('radio_sequence.json introuvable', e);
        this.seq = [];
      }
    }

    // ── YouTube IFrame ───────────────────────────────────────

    _initYT() {
      // Retourne une Promise résolue quand le player est prêt (onReady)
      return new Promise(resolve => {
        this.yt = new YT.Player('yt-player', {
          width: '100%', height: '100%',
          playerVars: { autoplay: 0, controls: 1, rel: 0, modestbranding: 1 },
          events: {
            onReady: () => {
              this.ytReady = true;
              resolve();
            },
            onStateChange: (e) => {
              if (e.data === YT.PlayerState.ENDED) this._next();
            },
          },
        });
      });
    }

    // ── Démarrage ────────────────────────────────────────────

    async start() {
      if (this.seq.length === 0) await this.load();
      this.started = true;
      this._show();                   // rend #yt-player visible avant tout

      await this._ytApiReady;         // attend l'API YouTube
      if (window.YT && window.YT.Player && !this.yt) {
        await this._initYT();         // attend onReady du player
      }

      this._playAt(0);
    }

    // ── Séquencement ─────────────────────────────────────────

    _playAt(index) {
      this.pos = ((index % this.seq.length) + this.seq.length) % this.seq.length;
      const item = this.seq[this.pos];

      // Sauter les liners/capsules sans URL (non encore générés)
      if ((item.type === 'liner' || item.type === 'capsule') && !item.url) {
        return this._playAt(this.pos + 1);
      }

      // Arrêter tout ce qui joue avant de passer à l'élément suivant
      this.trAudio.pause();
      if (this.ytReady) this.yt.stopVideo();

      this._updateNowPlaying(item);
      this._renderQueue();

      if (item.type === 'music') {
        // Musique → YouTube
        this._showYT();
        if (this.ytReady) {
          this.yt.loadVideoById(item.videoId);
          this.yt.setVolume(this._vol());
        }
      } else {
        // Liner MP3 + transitions (flash info, horoscope) → HTML5 Audio
        this._showTransition(item);
        this.trAudio.src    = this._resolveUrl(item.url);
        this.trAudio.volume = this._vol() / 100;
        this.trAudio.load();
        this.trAudio.play().catch(e => console.warn('[audio] échec play:', e.message, '\n  url:', item.url));
      }
    }

    _next() { this._playAt(this.pos + 1); }
    _prev() { this._playAt(this.pos - 1); }

    // Les liners sont co-hébergés avec le player (docs/liners/) — on résout
    // l'URL absolue GitHub Pages en chemin relatif pour que ça marche en local
    // ET sur GitHub Pages sans avoir besoin de pousser d'abord.
    _resolveUrl(url) {
      const base = 'https://famibelle.github.io/FlashInfoKarukera/';
      return url.startsWith(base) ? url.slice(base.length) : url;
    }

    // ── Lecture / pause ──────────────────────────────────────

    togglePlay() {
      const item = this.seq[this.pos];
      if (!item) return;
      if (item.type === 'music' && this.ytReady) {
        const s = this.yt.getPlayerState();
        s === YT.PlayerState.PLAYING ? this.yt.pauseVideo() : this.yt.playVideo();
        btnPlay.textContent = s === YT.PlayerState.PLAYING ? '▶' : '⏸';
      } else {
        this.trAudio.paused ? this.trAudio.play() : this.trAudio.pause();
        btnPlay.textContent = this.trAudio.paused ? '▶' : '⏸';
      }
    }

    setVolume(v) {
      if (this.ytReady) this.yt.setVolume(v);
      this.trAudio.volume = v / 100;
    }

    _vol() { return parseInt(document.getElementById('volume').value); }

    // ── UI ───────────────────────────────────────────────────

    _show() {
      document.getElementById('start-screen').style.display  = 'none';
      document.getElementById('player-screen').style.display = 'block';
      document.getElementById('live-dot').classList.add('on');
    }

    _showYT(isLiner = false) {
      document.getElementById('yt-wrap').style.display = '';
      document.getElementById('transition-overlay').classList.remove('on');
      // Teinte légère sur le cadre pendant un liner
      document.getElementById('yt-wrap').style.outline =
        isLiner ? '2px solid #6366f144' : 'none';
    }

    _showTransition(item) {
      document.getElementById('yt-wrap').style.display = 'none';
      const ovl = document.getElementById('transition-overlay');
      ovl.classList.add('on');
      document.getElementById('tr-icon').textContent  = item.icon  || '🎙️';
      document.getElementById('tr-label').textContent = item.label || '';
    }

    _updateNowPlaying(item) {
      btnPlay.textContent = '⏸';
      const subtypeLabels = {
        flash_info:   '📰 Flash Info',
        horoscope:    '✨ Horoscope',
        announcement: '🎙️ Annonce',
      };
      if (item.type === 'music') {
        document.getElementById('np-type').textContent   = '🎵 Musique';
        document.getElementById('np-title').textContent  = item.title  || '—';
        document.getElementById('np-artist').textContent = item.artist || '';
      } else if (item.type === 'liner') {
        document.getElementById('np-type').textContent   = '🎙️ Dans un moment…';
        document.getElementById('np-title').textContent  = item.label || 'Annonce à venir';
        document.getElementById('np-artist').textContent = '';
      } else if (item.type === 'capsule') {
        document.getElementById('np-type').textContent   = '🌺 Capsule culturelle';
        document.getElementById('np-title').textContent  = item.label || 'Guadeloupe';
        document.getElementById('np-artist').textContent = '';
      } else {
        document.getElementById('np-type').textContent   = subtypeLabels[item.subtype] || '🎙️';
        document.getElementById('np-title').textContent  = item.label || 'Transition';
        document.getElementById('np-artist').textContent = '';
      }
    }

    _renderQueue() {
      const subtypeIcons = { flash_info: '📰', horoscope: '✨', announcement: '🎙️' };
      const items = Array.from({ length: 5 }, (_, i) => this.seq[(this.pos + 1 + i) % this.seq.length]);
      document.getElementById('queue-list').innerHTML = items.map(it => {
        let icon, title, artist = '';
        if (it.type === 'music') {
          icon   = '🎵';
          title  = it.title  || '—';
          artist = it.artist || '';
        } else if (it.type === 'liner') {
          icon  = '🎙️';
          title = it.label || 'Dans un moment…';
        } else if (it.type === 'capsule') {
          icon  = '🌺';
          title = it.label || 'Capsule culturelle';
        } else {
          icon  = subtypeIcons[it.subtype] || '🎙️';
          title = it.label || 'Transition';
        }
        return `<div class="queue-item">
          <span class="qi-icon">${icon}</span>
          <div class="qi-info">
            <div class="qi-title">${title}</div>
            ${artist ? `<div class="qi-artist">${artist}</div>` : ''}
          </div>
        </div>`;
      }).join('');
      this._renderFullPlaylist();
    }

    _renderFullPlaylist() {
      if (!this._playlistOpen) return;
      const subtypeIcons = { flash_info: '📰', horoscope: '✨', announcement: '🎙️' };
      const el = document.getElementById('full-playlist');
      el.innerHTML = this.seq.map((it, i) => {
        let icon, title, artist = '';
        if (it.type === 'music') {
          icon   = '🎵';
          title  = it.title  || '—';
          artist = it.artist || '';
        } else if (it.type === 'liner') {
          icon  = '🎙️';
          title = it.label || 'Dans un moment…';
        } else if (it.type === 'capsule') {
          icon  = '🌺';
          title = it.label || 'Capsule culturelle';
        } else {
          icon  = subtypeIcons[it.subtype] || '🎙️';
          title = it.label || 'Transition';
        }
        const cur = i === this.pos ? ' pl-current' : '';
        return `<div class="pl-item${cur}" data-idx="${i}">
          <span class="pl-num">${i + 1}</span>
          <span class="pl-icon">${icon}</span>
          <div class="pl-info">
            <div class="pl-title">${title}</div>
            ${artist ? `<div class="pl-artist">${artist}</div>` : ''}
          </div>
        </div>`;
      }).join('');
      const cur = el.querySelector('.pl-current');
      if (cur) cur.scrollIntoView({ block: 'nearest' });
      el.querySelectorAll('.pl-item').forEach(row => {
        row.addEventListener('click', () => this._playAt(parseInt(row.dataset.idx)));
      });
    }
  }

  // ── Bootstrap ─────────────────────────────────────────────────────────────────

  const radio   = new RadioOrchestrator();   // onYouTubeIframeAPIReady posé dans le constructeur
  const btnPlay = document.getElementById('btn-play');

  radio.load();   // préchargement séquence en arrière-plan

  document.getElementById('start-btn').addEventListener('click', () => radio.start());
  btnPlay.addEventListener('click', () => radio.togglePlay());
  document.getElementById('btn-prev').addEventListener('click', () => radio._prev());
  document.getElementById('btn-skip').addEventListener('click', () => radio._next());
  document.getElementById('volume').addEventListener('input', e => radio.setVolume(parseInt(e.target.value)));
  document.getElementById('btn-toggle-playlist').addEventListener('click', () => {
    radio._playlistOpen = !radio._playlistOpen;
    document.getElementById('full-playlist').classList.toggle('open', radio._playlistOpen);
    document.getElementById('toggle-arrow').textContent = radio._playlistOpen ? '▲' : '▼';
    if (radio._playlistOpen) radio._renderFullPlaylist();
  });
  </script>
</body>
</html>
