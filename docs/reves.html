<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Reves Nocturnes — Radio Karukera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e8e8e8;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    a.back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      color: #8b8fa8;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      transition: color 0.15s;
    }
    a.back:hover { color: #e8e8e8; }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    header p {
      color: #8b8fa8;
      font-size: 0.9rem;
    }

    /* Filtres */
    .filters {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: #252836;
      border: 1px solid #333646;
      border-radius: 8px;
      color: #c4c8e2;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover { background: #2e3245; border-color: #4a4f6a; }
    .filter-btn.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: #fff;
    }

    /* Grille des cartes */
    .dreams-grid {
      display: grid;
      gap: 1.25rem;
      max-width: 800px;
      margin: 0 auto;
    }

    /* Carte reve */
    .dream-card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 16px;
      padding: 1.5rem;
      transition: border-color 0.15s, transform 0.15s;
      overflow: hidden;
    }
    .dream-card:hover {
      border-color: #4a4f6a;
      transform: translateY(-2px);
    }

    .dream-card.expanded {
      border-color: #3b82f6;
    }

    .dream-header {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .dream-date {
      background: #252836;
      border-radius: 8px;
      padding: 0.25rem 0.6rem;
      font-size: 0.75rem;
      color: #8b8fa8;
      font-weight: 500;
      flex-shrink: 0;
    }

    .dream-type {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: #3b82f620;
      color: #60a5fa;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .dream-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }

    .dream-score {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #10b98120;
      color: #34d399;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .dream-content {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #c4c8e2;
      margin-bottom: 1rem;
    }

    .dream-content.expanded {
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .dream-content blockquote {
      border-left: 3px solid #3b82f6;
      padding-left: 1rem;
      margin: 1rem 0;
      color: #93c5fd;
      font-style: italic;
    }

    .dream-content h1,
    .dream-content h2,
    .dream-content h3,
    .dream-content h4 {
      margin: 1.5rem 0 1rem 0;
      color: #e8e8e8;
    }

    .dream-content h2 { font-size: 1.3rem; border-bottom: 1px solid #2a2d3a; padding-bottom: 0.5rem; }
    .dream-content h3 { font-size: 1.1rem; color: #93c5fd; }
    .dream-content h4 { font-size: 1rem; color: #8b8fa8; }

    .dream-content ul,
    .dream-content ol {
      margin: 1rem 0;
      padding-left: 1.5rem;
      color: #c4c8e2;
    }

    .dream-content li {
      margin: 0.5rem 0;
    }

    .dream-content p {
      margin: 0.75rem 0;
    }

    .dream-content strong {
      color: #e8e8e8;
    }

    .dream-content em {
      color: #93c5fd;
      font-style: italic;
    }

    .dream-content a {
      color: #60a5fa;
      text-decoration: none;
    }

    .dream-content a:hover {
      text-decoration: underline;
    }

    .dream-content hr {
      border: none;
      border-top: 1px solid #2a2d3a;
      margin: 1.5rem 0;
    }

    .dream-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 0.85rem;
    }

    .dream-content th,
    .dream-content td {
      padding: 0.5rem;
      text-align: left;
      border: 1px solid #2a2d3a;
    }

    .dream-content th {
      background: #252836;
      color: #8b8fa8;
    }

    .dream-content tr:nth-child(even) {
      background: #1a1d27;
    }

    .dream-content tr:nth-child(odd) {
      background: #1f222e;
    }

    .dream-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.75rem;
      color: #666;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #2a2d3a;
    }

    .dream-link {
      color: #60a5fa;
      text-decoration: none;
      font-size: 0.8rem;
      cursor: pointer;
      transition: color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .dream-link:hover { color: #93c5fd; }

    .dream-link:before {
      content: '→';
      transition: transform 0.15s;
    }

    .dream-card.expanded .dream-link:before {
      transform: rotate(90deg);
    }

    /* Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dream-card {
      animation: fadeIn 0.3s ease forwards;
    }

    @keyframes expand {
      from { max-height: 500px; }
      to { max-height: 2000px; }
    }

    @media (max-width: 600px) {
      .dreams-grid { gap: 1rem; }
      .dream-header { flex-direction: column; gap: 0.5rem; align-items: flex-start; }
      .dream-content { font-size: 0.85rem; }
      .dream-content.expanded { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Retour</a>

  <header>
    <h1>🌙 Journal des Reves Nocturnes</h1>
    <p>Analyses oniriques quotidiennes de Radio Karukera</p>
  </header>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">Tous</button>
    <button class="filter-btn" data-filter="antenne">🎤 Antenne</button>
    <button class="filter-btn" data-filter="technique">🎛️ Technique</button>
  </div>

  <div class="dreams-grid" id="dreams-grid">
    <!-- Les cartes seront générées par JavaScript -->
  </div>

  <script>
    let dreamsData = [];
    let currentFilter = 'all';
    const contentCache = new Map();

    function formatDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
    }

    function applyInline(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`(.*?)`/g, '<code>$1</code>')
        .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>');
    }

    function isSeparatorRow(row) {
      return row.split('|').slice(1, -1).every(c => /^[\s\-:]+$/.test(c));
    }

    function renderTable(rows) {
      if (rows.length < 2) return rows.map(r => `<p>${r}</p>`).join('');
      const headers = rows[0].split('|').slice(1, -1).map(c => c.trim());
      const dataRows = rows.slice(2).filter(r => r.trim());
      let t = '<table><thead><tr>' + headers.map(h => `<th>${applyInline(h)}</th>`).join('') + '</tr></thead><tbody>';
      dataRows.forEach(row => {
        const cells = row.split('|').slice(1, -1).map(c => c.trim());
        if (cells.length) t += '<tr>' + cells.map(c => `<td>${applyInline(c)}</td>`).join('') + '</tr>';
      });
      return t + '</tbody></table>';
    }

    function renderMarkdown(text) {
      let lines = text.split('\n');
      // Sauter jusqu'après le premier séparateur ---
      let startIndex = 0;
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].trim() === '---') { startIndex = i + 1; break; }
      }
      lines = lines.slice(startIndex);
      while (lines.length && lines[0].trim() === '') lines.shift();

      let html = '';
      let inList = false;
      let inBlockquote = false;
      let inTable = false;
      let tableRows = [];

      function flushTable() {
        if (inTable) { html += renderTable(tableRows); tableRows = []; inTable = false; }
      }
      function flushList() {
        if (inList) { html += '</ul>'; inList = false; }
      }
      function flushBlockquote() {
        if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
      }

      lines.forEach(line => {
        if (line.trim() === '---') {
          flushTable(); flushList(); flushBlockquote();
          html += '<hr>'; return;
        }
        if (line.startsWith('## ')) {
          flushTable(); flushList(); flushBlockquote();
          html += `<h2>${applyInline(line.substring(3).trim())}</h2>`; return;
        }
        if (line.startsWith('### ')) {
          flushTable(); flushList(); flushBlockquote();
          html += `<h3>${applyInline(line.substring(4).trim())}</h3>`; return;
        }
        if (line.startsWith('#### ')) {
          flushTable(); flushList(); flushBlockquote();
          html += `<h4>${applyInline(line.substring(5).trim())}</h4>`; return;
        }
        // Tableaux
        if (line.startsWith('|')) {
          flushList(); flushBlockquote();
          if (!isSeparatorRow(line)) { inTable = true; tableRows.push(line); }
          else if (inTable) tableRows.push(line);
          return;
        }
        flushTable();
        // Blockquotes
        if (line.startsWith('>')) {
          flushList();
          if (!inBlockquote) { html += '<blockquote>'; inBlockquote = true; }
          html += applyInline(line.substring(1).trim()) + '<br>'; return;
        }
        flushBlockquote();
        // Listes
        if (line.startsWith('- ') || line.startsWith('* ')) {
          if (!inList) { html += '<ul>'; inList = true; }
          let content = line.substring(2).trim();
          if (/^\[x\] /i.test(content))      html += `<li>✅ ${applyInline(content.substring(4))}</li>`;
          else if (content.startsWith('[ ] ')) html += `<li>☐ ${applyInline(content.substring(4))}</li>`;
          else                                 html += `<li>${applyInline(content)}</li>`;
          return;
        }
        flushList();
        if (line.trim()) html += `<p>${applyInline(line)}</p>`;
      });

      flushTable(); flushList(); flushBlockquote();
      return html;
    }

    async function loadFullContent(file) {
      if (contentCache.has(file)) return contentCache.get(file);
      try {
        const r = await fetch(file);
        if (!r.ok) throw new Error();
        const text = await r.text();
        contentCache.set(file, text);
        return text;
      } catch { return null; }
    }

    async function toggleDreamCard(card, dream) {
      card.classList.toggle('expanded');
      const contentDiv = card.querySelector('.dream-content');
      const link = card.querySelector('.dream-link');
      if (card.classList.contains('expanded')) {
        link.textContent = 'Masquer';
        const full = await loadFullContent(dream.file);
        if (full) { contentDiv.innerHTML = renderMarkdown(full); contentDiv.classList.add('expanded'); }
      } else {
        link.textContent = "Lire l'analyse complète";
        contentDiv.innerHTML = `<p>${dream.excerpt}</p>`;
        contentDiv.classList.remove('expanded');
      }
    }

    function createDreamCard(dream) {
      const card = document.createElement('div');
      card.className = 'dream-card';
      card.dataset.type = dream.type;
      card.dataset.date = dream.date;
      const typeLabel = dream.type === 'technique' ? '🎛️ Technique' : '🎤 Antenne';
      card.innerHTML = `
        <div class="dream-header">
          <span class="dream-date">${formatDate(dream.date)}</span>
          <span class="dream-type">${typeLabel}</span>
        </div>
        <h2 class="dream-title">🌙 ${dream.title}</h2>
        <div class="dream-content"><p>${dream.excerpt}</p></div>
        <div class="dream-meta">
          <span class="dream-link">Lire l'analyse complète</span>
        </div>`;
      card.querySelector('.dream-link').addEventListener('click', e => {
        e.preventDefault();
        toggleDreamCard(card, dream);
      });
      return card;
    }

    function renderDreams(filter = 'all') {
      const grid = document.getElementById('dreams-grid');
      grid.innerHTML = '';
      const list = filter === 'all' ? dreamsData : dreamsData.filter(d => d.type === filter);
      if (!list.length) {
        grid.innerHTML = '<p style="text-align:center;color:#666;padding:2rem">Aucun rêve disponible</p>';
        return;
      }
      list.forEach(dream => grid.appendChild(createDreamCard(dream)));
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderDreams(currentFilter);
      });
    });

    async function init() {
      try {
        const r = await fetch('reves/index.json');
        if (!r.ok) throw new Error();
        dreamsData = await r.json();
      } catch {
        dreamsData = [];
      }
      renderDreams(currentFilter);
    }

    init();
  </script>
</body>
</html>
