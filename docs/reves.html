<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Rêves Nocturnes — Botiran</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.5rem;
    }

    .back {
      align-self: flex-start;
      margin-bottom: 1.25rem;
      text-decoration: none;
      color: #555;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.15s;
    }
    .back:hover { color: #e8e8e8; }

    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 16px;
      padding: 2rem;
      max-width: 900px;
      width: 100%;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    
    .tagline {
      font-size: 1rem;
      color: #8b8fa8;
      text-align: center;
      margin-bottom: 2rem;
    }

    /* Filtres par type */
    .filters {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #252836;
      border: 1px solid #333646;
      border-radius: 8px;
      padding: 0.4rem 0.8rem;
      color: #b0b4cc;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      text-decoration: none;
    }
    .filter-btn:hover, .filter-btn.active {
      background: #6366f1;
      border-color: #5255e0;
      color: #fff;
    }

    /* Liste des rêves */
    .dreams-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .dream-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      text-decoration: none;
      color: #e8e8e8;
    }

    .dream-item:hover {
      background: #252836;
      border-color: #3e4150;
    }

    .dream-date {
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      min-width: 100px;
    }

    .dream-type {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      background: #1e3a2f;
      color: #4ade80;
    }

    .dream-title {
      font-size: 0.95rem;
      color: #b0b4cc;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dream-arrow {
      color: #555;
      font-size: 1rem;
    }

    /* Loading */
    .loading {
      color: #555;
      font-size: 0.9rem;
      text-align: center;
      padding: 2rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .dream-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }
      
      .dream-date {
        min-width: auto;
      }
      
      .card {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Botiran</a>
  
  <div class="card">
    <h1>🌙 Rêves Nocturnes</h1>
    <p class="tagline">Analyses oniriques de Radio Karukera<br>Générées quotidiennement par Botiran</p>

    <!-- Filtres -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">Tous</button>
      <button class="filter-btn" data-filter="antenne">📡 Antenne</button>
      <button class="filter-btn" data-filter="technique">⚙️ Technique</button>
    </div>

    <!-- Liste des rêves -->
    <div class="dreams-list" id="dreams-list">
      <div class="loading">Chargement des rêves...</div>
    </div>
  </div>

  <script>
    // Liste des rêves (statique pour éviter les problèmes de fetch)
    const allDreams = [
      {
        date: "2026-05-08",
        type: "antenne",
        title: "Rêve Antenne — 08 mai 2026",
        file: "reves/antenne/2026-05-08.md"
      },
      {
        date: "2026-05-08",
        type: "technique", 
        title: "Rêve Technique — 08 mai 2026",
        file: "reves/technique/2026-05-08.md"
      },
      {
        date: "2026-05-07",
        type: "antenne",
        title: "Rêve Antenne — 07 mai 2026",
        file: "reves/antenne/2026-05-07.md"
      },
      {
        date: "2026-05-07",
        type: "technique",
        title: "Rêve Technique — 07 mai 2026",
        file: "reves/technique/2026-05-07.md"
      }
    ];
    
    let filteredDreams = [...allDreams];
    
    // Formater la date
    function formatDate(dateStr) {
      const [year, month, day] = dateStr.split('-');
      const date = new Date(year, month - 1, day);
      return date.toLocaleDateString('fr-FR', { 
        day: '2-digit', 
        month: 'short', 
        year: 'numeric' 
      });
    }
    
    // Afficher les rêves
    function displayDreams(dreams) {
      const container = document.getElementById('dreams-list');
      
      if (dreams.length === 0) {
        container.innerHTML = '<div class="loading">Aucun rêve trouvé.</div>';
        return;
      }
      
      container.innerHTML = dreams.map(dream => `
        <a href="${dream.file}" class="dream-item" target="_blank">
          <span class="dream-date">${formatDate(dream.date)}</span>
          <span class="dream-type">${dream.type === 'antenne' ? '📡 Antenne' : '⚙️ Technique'}</span>
          <span class="dream-title">${dream.title}</span>
          <span class="dream-arrow">›</span>
        </a>
      `).join('');
    }
    
    // Filtrer les rêves
    function filterDreams(type) {
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === type);
      });
      
      filteredDreams = type === 'all' 
        ? allDreams 
        : allDreams.filter(d => d.type === type);
      
      displayDreams(filteredDreams);
    }
    
    // Initialisation
    document.addEventListener('DOMContentLoaded', () => {
      // Ajouter les écouteurs sur les boutons de filtre
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => filterDreams(btn.dataset.filter));
      });
      
      // Afficher tous les rêves
      displayDreams(allDreams);
    });
  </script>
</body>
</html>
