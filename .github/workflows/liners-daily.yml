name: Liners Quotidiens

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: "Mode verbeux (affiche le texte généré)"
        type: boolean
        required: false
        default: false
      very_verbose:
        description: "Mode TRÈS verbeux (affiche prompts LLM + détails techniques)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  generate-liners:
    name: 🎙️ Générer Liners
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configurer les credentials git pour le submodule privé
        run: git config --global url."https://${{ secrets.PAT_SUBMODULE }}@github.com/".insteadOf "https://github.com/"

      - name: Checkout code et submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_SUBMODULE }}
          submodules: true

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer tous les liners pour la journée
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          VERBOSE_MODE: ${{ github.event.inputs.very_verbose == 'true' && '2' || (github.event.inputs.verbose == 'true' && '1' || '0') }}
        run: |
          # Générer les liners pour matin, midi, soir
          VERBOSE_ARG=""
          if [ "$VERBOSE_MODE" -ge 1 ]; then
            VERBOSE_ARG="--verbose"
          fi
          # Mode très verbeux : active aussi le logging Python (niveau DEBUG)
          if [ "$VERBOSE_MODE" -ge 2 ]; then
            export PYTHON_LOG_LEVEL=DEBUG
          fi
          python generate_radio_sequence.py --generate-liners-only --bloc matin $VERBOSE_ARG
          python generate_radio_sequence.py --generate-liners-only --bloc midi  $VERBOSE_ARG
          python generate_radio_sequence.py --generate-liners-only --bloc soir  $VERBOSE_ARG

      - name: Commit les liners générés
        run: |
          git config user.name "github-actions[Liners]"
          git config user.email "github-actions@github.com"
          git add docs/liners/
          git diff --cached --quiet || git commit -m "feat: liners quotidiens [skip ci]"
          git push
