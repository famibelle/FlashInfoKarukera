name: Liners Quotidiens

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-liners:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configurer les credentials git pour le submodule privé
        run: git config --global url."https://${{ secrets.PAT_SUBMODULE }}@github.com/".insteadOf "https://github.com/"

      - name: Checkout code et submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_SUBMODULE }}
          submodules: true

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer tous les liners pour la journée
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          # Générer les liners pour matin, midi, soir
          python generate_radio_sequence.py --generate-liners-only --bloc matin
          python generate_radio_sequence.py --generate-liners-only --bloc midi
          python generate_radio_sequence.py --generate-liners-only --bloc soir

      - name: Commit les liners générés
        run: |
          git config user.name "github-actions[Liners]"
          git config user.email "github-actions@github.com"
          git add docs/liners/ playlists/youtube_cache.json
          git diff --cached --quiet || git commit -m "feat: liners quotidiens [skip ci]"
          git stash --include-untracked || true
          git pull --rebase -X theirs origin main
          git stash drop 2>/dev/null || true
          git push
