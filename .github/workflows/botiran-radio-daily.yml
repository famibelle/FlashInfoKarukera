name: 🎶 YouTube Music Radio Playlist Update

on:
  workflow_run:
    workflows:
      - "Horoscope Quotidien"
      - "Flash Info Guadeloupe"
    types: [completed]

  workflow_dispatch:
    inputs:
      verbose:
        description: "Mode verbeux (affiche le détail de chaque étape)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: radio-update
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Vérifier que horoscope ET flash info ont réussi récemment
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          NOW=$(date -u +%s)
          WINDOW=10800  # 3 heures

          last_success() {
            gh api "repos/$REPO/actions/runs?per_page=10" \
              --jq ".workflow_runs[] | select(.name == \"$1\" and .conclusion == \"success\") | .updated_at" \
              | head -1
          }

          HORO_AT=$(last_success "Horoscope Quotidien")
          FLASH_AT=$(last_success "Flash Info Guadeloupe")

          HORO_TS=$(date -d "${HORO_AT:-1970-01-01}" +%s 2>/dev/null || echo 0)
          FLASH_TS=$(date -d "${FLASH_AT:-1970-01-01}" +%s 2>/dev/null || echo 0)

          HORO_AGE=$((NOW - HORO_TS))
          FLASH_AGE=$((NOW - FLASH_TS))

          echo "Horoscope : ${HORO_AT} (age ${HORO_AGE}s)"
          echo "Flash info : ${FLASH_AT} (age ${FLASH_AGE}s)"

          if [ "$HORO_AGE" -lt "$WINDOW" ] && [ "$FLASH_AGE" -lt "$WINDOW" ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "⏭️  Les deux workflows n'ont pas encore terminé — mise à jour ignorée."
          fi

  # ── Job 1 : mise à jour de la playlist YouTube Music ──────────────────────
  playlist-24h:
    needs: gate
    if: ${{ needs.gate.outputs.ok == 'true' }}
    name: 📻 Playlist 24h
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Configurer les credentials git pour le submodule privé
        run: git config --global url."https://${{ secrets.PAT_SUBMODULE }}@github.com/".insteadOf "https://github.com/"

      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PAT_SUBMODULE }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔑 Write YouTube Music auth file
        run: |
          echo '${{ secrets.YTMUSIC_BROWSER_JSON_B64 }}' | base64 -d > browser.json
          echo "🔑 browser.json écrit : $(stat -c%s browser.json) octets"

      - name: 🔑 Write YouTube Data API token
        run: |
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > youtube_token.json
          echo "🔑 youtube_token.json écrit : $(stat -c%s youtube_token.json) octets"

      - name: 🔍 Vérifier secrets et environnement
        run: |
          echo "=== DIAGNOSTIC DÉBUT JOB playlist-24h ==="
          echo "YTMUSIC_PLAYLIST_24H_ID: ${YTMUSIC_PLAYLIST_24H_ID:0:8}..."
          echo "MISTRAL_API_KEY: ${MISTRAL_API_KEY:0:8}..."
          echo "browser.json: $(test -f browser.json && echo '✅ EXISTS' || echo '❌ MISSING')"
          echo "youtube_token.json: $(test -f youtube_token.json && echo '✅ EXISTS' || echo '❌ MISSING')"
          echo "playlists/ dir: $(test -d playlists && echo '✅ EXISTS' || echo '❌ MISSING')"
          echo "=== END DIAGNOSTIC ==="

      - name: 📻 Mise à jour playlist 24h
        env:
          YTMUSIC_PLAYLIST_24H_ID: ${{ secrets.YTMUSIC_PLAYLIST_24H_ID }}
          YOUTUBE_TOKEN_PATH: youtube_token.json
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python playlist_24h.py --no-flash --no-horoscope --no-announce

      - name: ✅ Vérifier génération du pool musical
        run: |
          if [ ! -f playlists/music_pool_cache.json ]; then
            echo "❌ music_pool_cache.json NON GÉNÉRÉ"
            exit 1
          fi
          SIZE=$(stat -c%s playlists/music_pool_cache.json)
          TRACKS=$(jq '.tracks | length' playlists/music_pool_cache.json 2>/dev/null || echo "N/A")
          echo "✅ Pool musical : $SIZE octets, $TRACKS pistes"
          cat playlists/playlist_24h_id.txt

      - name: 📤 Upload caches playlist
        uses: actions/upload-artifact@v4
        with:
          name: playlist-caches
          path: playlists/
          retention-days: 1
          if-no-files-found: error

  # ── Job 2 : génération de la séquence radio et des liners ─────────────────
  radio-sequence:
    needs: playlist-24h
    name: 🎙️ Séquence Radio & Liners
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Configurer les credentials git pour le submodule privé
        run: git config --global url."https://${{ secrets.PAT_SUBMODULE }}@github.com/".insteadOf "https://github.com/"

      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PAT_SUBMODULE }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔑 Write YouTube Music auth file
        run: |
          echo '${{ secrets.YTMUSIC_BROWSER_JSON_B64 }}' | base64 -d > browser.json
          echo "🔑 browser.json écrit : $(stat -c%s browser.json) octets"

      - name: 🔑 Write YouTube Data API token
        run: |
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > youtube_token.json
          echo "🔑 youtube_token.json écrit : $(stat -c%s youtube_token.json) octets"

      - name: 📥 Download caches playlist
        uses: actions/download-artifact@v4
        with:
          name: playlist-caches
          path: playlists/

      - name: 🔍 Diagnostic job radio-sequence
        run: |
          echo "=== DIAGNOSTIC DÉBUT JOB radio-sequence ==="
          echo "MISTRAL_API_KEY: ${MISTRAL_API_KEY:0:8}..."
          echo "browser.json: $(test -f browser.json && echo '✅ EXISTS' || echo '❌ MISSING')"
          echo "docs/podcast.xml: $(test -f docs/podcast.xml && echo '✅ EXISTS' || echo '❌ MISSING')"
          echo "playlists/ dir: $(test -d playlists && echo '✅ EXISTS' || echo '❌ MISSING')"
          echo "playlists/music_pool_cache.json: $(test -f playlists/music_pool_cache.json && echo '✅ EXISTS' || echo '❌ MISSING')"
          echo "=== END DIAGNOSTIC ==="

      - name: 🎙️ Génération de la séquence radio
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.verbose }}" = "true" ]; then
            ARGS="--verbose"
          fi
          python generate_radio_sequence.py $ARGS

      - name: ✅ Vérifier génération de la séquence
        run: |
          if [ ! -f docs/radio_sequence.json ]; then
            echo "❌ radio_sequence.json NON GÉNÉRÉ"
            echo "Contenu de docs/:"
            ls -la docs/ || true
            exit 1
          fi
          SIZE=$(stat -c%s docs/radio_sequence.json)
          ELEMENTS=$(jq '.sequence | length' docs/radio_sequence.json 2>/dev/null || echo "N/A")
          MUSIC=$(jq '.music' docs/radio_sequence.json 2>/dev/null || echo "N/A")
          LINERS=$(jq '.liners' docs/radio_sequence.json 2>/dev/null || echo "N/A")
          CAPSULES=$(jq '.capsules' docs/radio_sequence.json 2>/dev/null || echo "N/A")
          echo "✅ Séquence radio : $SIZE octets"
          echo "   $ELEMENTS éléments ($MUSIC musique, $LINERS liners, $CAPSULES capsules)"

      - name: 📤 Upload séquence et contenus générés
        uses: actions/upload-artifact@v4
        with:
          name: radio-content
          path: |
            docs/radio_sequence.json
            docs/liners/
            docs/capsules/
          if-no-files-found: error
          retention-days: 1

  # ── Job 3 : nettoyage audio + commit ──────────────────────────────────────
  commit:
    needs: radio-sequence
    name: 🧹 Nettoyage & 💾 Commit
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Configurer les credentials git pour le submodule privé
        run: git config --global url."https://${{ secrets.PAT_SUBMODULE }}@github.com/".insteadOf "https://github.com/"

      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PAT_SUBMODULE }}

      - name: 🔄 Fetch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main

      - name: 🔍 Diagnostic début job commit
        run: |
          echo "=== DIAGNOSTIC DÉBUT JOB commit ==="
          echo "Répertoire courant: $(pwd)"
          echo "Contenu initial docs/:"
          ls -la docs/ || true
          echo "Contenu initial playlists/:"
          ls -la playlists/ || true
          echo "=== END DIAGNOSTIC ==="

      - name: 📥 Download caches playlist
        uses: actions/download-artifact@v4
        with:
          name: playlist-caches
          path: playlists/

      - name: ✅ Vérifier artefact playlist-caches
        run: |
          echo "📦 Artefact playlist-caches téléchargé :"
          ls -la playlists/ || true
          if [ ! -f playlists/music_pool_cache.json ]; then
            echo "❌ music_pool_cache.json MANQUANT dans playlist-caches"
            exit 1
          fi
          TRACKS=$(jq '.tracks | length' playlists/music_pool_cache.json 2>/dev/null || echo "N/A")
          echo "✅ Pool musical téléchargé : $TRACKS pistes"

      - name: 📥 Download séquence radio
        uses: actions/download-artifact@v4
        with:
          name: radio-content
          path: .

      - name: ✅ Vérifier artefact radio-content
        run: |
          echo "📦 Artefact radio-content téléchargé :"
          ls -la docs/ || true
          if [ ! -f docs/radio_sequence.json ]; then
            echo "❌ radio_sequence.json MANQUANT dans radio-content"
            exit 1
          fi
          ELEMENTS=$(jq '.sequence | length' docs/radio_sequence.json 2>/dev/null || echo "N/A")
          echo "✅ Séquence radio téléchargée : $ELEMENTS éléments"

      - name: 📋 Générer le rapport de playlist
        run: |
          python show_playlist.py --no-colors --stats  > playlist_report.txt
          python show_playlist.py --no-colors          >> playlist_report.txt
        continue-on-error: true

      - name: 📤 Upload rapport de playlist
        uses: actions/upload-artifact@v4
        with:
          name: playlist-report
          path: playlist_report.txt
          retention-days: 7

      - name: 🧹 Nettoyage mensuel docs/audio/ (> 60 jours)
        run: |
          python3 - <<'EOF'
          import re
          from datetime import date, timedelta
          from pathlib import Path

          cutoff = date.today() - timedelta(days=60)
          total = 0
          for ym_dir in sorted(Path("docs/audio").glob("*/????-??")):
              m = re.fullmatch(r"(\d{4})-(\d{2})", ym_dir.name)
              if not m:
                  continue
              dir_date = date(int(m.group(1)), int(m.group(2)), 1)
              if dir_date < cutoff:
                  n = sum(1 for f in ym_dir.glob("*") if f.unlink() is None)
                  ym_dir.rmdir()
                  total += n
                  print(f"🗑️  Supprimé : {ym_dir} ({n} fichiers)")
          print(f"ℹ️  {total} fichiers audio supprimés" if total else "ℹ️  Aucun fichier audio à supprimer")
          EOF

      - name: 🔍 Vérifier fichiers avant commit
        run: |
          echo "=== FICHIERS À COMMITTER ==="
          echo "playlists/music_pool_cache.json: $(test -f playlists/music_pool_cache.json && echo '✅' || echo '❌')"
          echo "playlists/playlist_24h_id.txt: $(test -f playlists/playlist_24h_id.txt && echo '✅' || echo '❌')"
          echo "docs/radio_sequence.json: $(test -f docs/radio_sequence.json && echo '✅' || echo '❌')"
          echo "docs/liners/: $(test -d docs/liners && echo '✅' || echo '❌')"
          echo "docs/capsules/: $(test -d docs/capsules && echo '✅' || echo '❌')"
          echo "Taille radio_sequence.json: $(test -f docs/radio_sequence.json && stat -c%s docs/radio_sequence.json || echo 'N/A') octets"
          echo "=== END VÉRIFICATION ==="

      - name: 💾 Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ajouter tous les fichiers à committer (youtube_cache.json est dans .gitignore)
          git add playlists/music_pool_cache.json playlists/playlist_24h_id.txt docs/radio_sequence.json
          [ -d docs/liners ]   && git add docs/liners/   || true
          [ -d docs/capsules ] && git add docs/capsules/ || true
          [ -d docs/audio ]    && { git add docs/audio/; git add -u docs/audio/; } || true
          
          # Vérifier s'il y a des changements
          if git diff --cached --quiet; then
            echo "ℹ️  Aucune modification à committer"
            exit 0
          fi
          
          echo "📝 Fichiers staged :"
          git diff --cached --name-only
          
          # Stocker les changements avant pull
          git stash push --include-untracked
          
          # Pull avec résolution automatique (stratégie 'theirs' = garde les changements locaux)
          git pull --no-rebase --strategy-option theirs origin main
          
          # Réappliquer les changements
          git stash pop
          
          # Commit
          git commit -m "chore: update radio sequence & caches [skip ci]"
          git push

      - name: ✅ Résumé final
        if: success()
        run: |
          H24_ID=$(cat playlists/playlist_24h_id.txt 2>/dev/null || echo "")
          POOL_TRACKS=$(jq '.tracks | length' playlists/music_pool_cache.json 2>/dev/null || echo "N/A")
          SEQ_ELEMENTS=$(jq '.sequence | length' docs/radio_sequence.json 2>/dev/null || echo "N/A")
          echo ""
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║          ✅  MISE À JOUR RADIO RÉUSSIE               ║"
          echo "╚══════════════════════════════════════════════════════╝"
          echo ""
          echo "  🕐  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "  📊 STATISTIQUES :"
          echo "     • Pool musical : $POOL_TRACKS pistes"
          echo "     • Séquence : $SEQ_ELEMENTS éléments"
          [ -n "$H24_ID" ] && echo "  🎵  Playlist 24h  → https://music.youtube.com/playlist?list=$H24_ID"
          echo "  📻  Séquence web  → https://famibelle.github.io/FlashInfoKarukera/radio.html"
          echo ""

      - name: ❌ Échec — Diagnostic complet
        if: failure()
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║          ❌ MISE À JOUR RADIO ÉCHOUÉE                 ║"
          echo "╚══════════════════════════════════════════════════════╝"
          echo ""
          echo "  🔍 DIAGNOSTIC FINAL :"
          echo "  playlists/music_pool_cache.json: $(test -f playlists/music_pool_cache.json && echo '✅' || echo '❌ MISSING')"
          echo "  docs/radio_sequence.json: $(test -f docs/radio_sequence.json && echo '✅' || echo '❌ MISSING')"
          echo "  playlists/playlist_24h_id.txt: $(test -f playlists/playlist_24h_id.txt && echo '✅' || echo '❌ MISSING')"
          echo ""
          echo "  Contenu playlists/ :"
          ls -la playlists/ || true
          echo ""
          echo "  Contenu docs/ :"
          ls -la docs/ || true
          echo ""
          exit 1
