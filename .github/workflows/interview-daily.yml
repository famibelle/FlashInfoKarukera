name: Interview Radio Quotidienne

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: "Mode verbeux (affiche le détail de chaque étape)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  generate-interview:
    name: 🎤 Générer Interview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configurer les credentials git pour le submodule privé
        run: git config --global url."https://${{ secrets.PAT_SUBMODULE }}@github.com/".insteadOf "https://github.com/"

      - name: Checkout code et submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_SUBMODULE }}
          submodules: true

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer l'interview radio
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python generate_interview.py

      - name: Commit l'interview et la séquence mise à jour
        run: |
          git config user.name "github-actions[Interview]"
          git config user.email "github-actions@github.com"
          git add docs/audio/Emissions/ docs/radio_sequence.json
          git diff --cached --quiet || git commit -m "feat: interview radio quotidienne + intégration playlist [skip ci]"
          git stash --include-untracked || true
          git pull --rebase -X theirs origin main
          git stash drop 2>/dev/null || true
          git push
