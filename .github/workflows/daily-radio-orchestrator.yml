name: 🚀 Génération complète — Orchestrateur séquentiel

on:
  schedule:
    - cron: '0 2 * * *'   # 4h Paris (2h UTC)
    - cron: '0 8 * * *'   # 10h Paris (8h UTC)
    - cron: '0 14 * * *'  # 16h Paris (14h UTC)
  workflow_dispatch:
    inputs:
      verbose:
        description: "Verbose — affiche le détail de chaque étape"
        type: boolean
        required: false
        default: true
      run_horoscope:
        description: "✅ Exécuter Horoscope Quotidien"
        type: boolean
        required: false
        default: true
      run_flash_info:
        description: "✅ Exécuter Flash Info Guadeloupe"
        type: boolean
        required: false
        default: true
      run_capsules:
        description: "✅ Exécuter Capsules Culturelles"
        type: boolean
        required: false
        default: true
      run_emission:
        description: "✅ Exécuter Émission Culturelle"
        type: boolean
        required: false
        default: true
      run_playlist:
        description: "✅ Exécuter Mise à jour Playlist"
        type: boolean
        required: false
        default: true
      skip_liners:
        description: "🎙️ Skipper la génération audio des liners (TTS)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  horoscope:
    name: 🔮 Horoscope
    if: inputs.run_horoscope == true || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: ⏱️  Start Time Tracking
        id: start-time
        run: echo "time=$(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Déclencher Horoscope
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
          VERBOSE: ${{ github.event.inputs.verbose }}
        run: |
          gh workflow run horoscope-daily.yml --repo "$REPO" --field verbose=${VERBOSE:-false}
          sleep 15
          WORKFLOW_ID=$(gh api repos/$REPO/actions/workflows/horoscope-daily.yml --jq '.id')
          RUN_ID=$(gh api repos/$REPO/actions/workflows/$WORKFLOW_ID/runs --jq '.workflow_runs[0].id')
          gh run watch "$RUN_ID" --interval 20 --exit-status --repo "$REPO"

      - name: ⏱️  Execution Time Summary
        run: |
          echo "=========================================="
          echo "  ⏱️  HOROSCOPE JOB TIME SUMMARY"
          echo "=========================================="
          echo "  Start: ${{ env.JOB_START_TIME }}"
          echo "  End:   $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "  Total: ~$(($(date +%s) - $(date -d "${{ env.JOB_START_TIME }}" +%s 2>/dev/null || echo 0))) seconds"
          echo "=========================================="
        env:
          JOB_START_TIME: ${{ steps.start-time.outputs.time }}

  flash-info:
    name: 📰 Flash Info
    needs: horoscope
    if: inputs.run_flash_info == true || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: ⏱️  Start Time Tracking
        id: start-time
        run: echo "time=$(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Déclencher Flash Info
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
          VERBOSE: ${{ github.event.inputs.verbose }}
        run: |
          gh workflow run flash-info.yml --repo "$REPO" --field verbose=${VERBOSE:-false}
          sleep 15
          WORKFLOW_ID=$(gh api repos/$REPO/actions/workflows/flash-info.yml --jq '.id')
          RUN_ID=$(gh api repos/$REPO/actions/workflows/$WORKFLOW_ID/runs --jq '.workflow_runs[0].id')
          gh run watch "$RUN_ID" --interval 20 --exit-status --repo "$REPO"

      - name: ⏱️  Execution Time Summary
        run: |
          echo "=========================================="
          echo "  ⏱️  FLASH INFO JOB TIME SUMMARY"
          echo "=========================================="
          echo "  Start: ${{ env.JOB_START_TIME }}"
          echo "  End:   $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "  Total: ~$(($(date +%s) - $(date -d "${{ env.JOB_START_TIME }}" +%s 2>/dev/null || echo 0))) seconds"
          echo "=========================================="
        env:
          JOB_START_TIME: ${{ steps.start-time.outputs.time }}

  capsules:
    name: 🌺 Capsules
    needs: flash-info
    if: inputs.run_capsules == true || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: ⏱️  Start Time Tracking
        id: start-time
        run: echo "time=$(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Déclencher Capsules
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run capsules-daily.yml --repo "$REPO"
          sleep 15
          WORKFLOW_ID=$(gh api repos/$REPO/actions/workflows/capsules-daily.yml --jq '.id')
          RUN_ID=$(gh api repos/$REPO/actions/workflows/$WORKFLOW_ID/runs --jq '.workflow_runs[0].id')
          gh run watch "$RUN_ID" --interval 20 --exit-status --repo "$REPO"

      - name: ⏱️  Execution Time Summary
        run: |
          echo "=========================================="
          echo "  ⏱️  CAPSULES JOB TIME SUMMARY"
          echo "=========================================="
          echo "  Start: ${{ env.JOB_START_TIME }}"
          echo "  End:   $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "  Total: ~$(($(date +%s) - $(date -d "${{ env.JOB_START_TIME }}" +%s 2>/dev/null || echo 0))) seconds"
          echo "=========================================="
        env:
          JOB_START_TIME: ${{ steps.start-time.outputs.time }}

  emission:
    name: 📻 Émission
    needs: capsules
    if: inputs.run_emission == true || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: ⏱️  Start Time Tracking
        id: start-time
        run: echo "time=$(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Déterminer l'édition
        id: edition
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -lt 12 ]; then
            echo "value=matin" >> $GITHUB_OUTPUT
          else
            echo "value=soir" >> $GITHUB_OUTPUT
          fi

      - name: Déclencher Émission
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run emission-daily.yml --repo "$REPO" --field edition=${{ steps.edition.outputs.value }}
          sleep 15
          WORKFLOW_ID=$(gh api repos/$REPO/actions/workflows/emission-daily.yml --jq '.id')
          RUN_ID=$(gh api repos/$REPO/actions/workflows/$WORKFLOW_ID/runs --jq '.workflow_runs[0].id')
          gh run watch "$RUN_ID" --interval 20 --repo "$REPO" || true

      - name: ⏱️  Execution Time Summary
        run: |
          echo "=========================================="
          echo "  ⏱️  ÉMISSION JOB TIME SUMMARY"
          echo "=========================================="
          echo "  Start: ${{ env.JOB_START_TIME }}"
          echo "  End:   $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "  Total: ~$(($(date +%s) - $(date -d "${{ env.JOB_START_TIME }}" +%s 2>/dev/null || echo 0))) seconds"
          echo "=========================================="
        env:
          JOB_START_TIME: ${{ steps.start-time.outputs.time }}

  playlist:
    name: 🎶 Playlist
    needs: emission
    if: inputs.run_playlist == true || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: ⏱️  Start Time Tracking
        id: start-time
        run: echo "time=$(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier si émission existe
        id: check_emission
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -lt 12 ]; then EDITION=matin; else EDITION=soir; fi
          FILE="docs/audio/Emissions/emission-$(date -u +%Y-%m-%d)-${EDITION}.mp3"
          if [ -f "$FILE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Déclencher Playlist
        if: steps.check_emission.outputs.exists == 'true' || inputs.run_emission == true
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
        run: |
          # Préparer les inputs pour botiran-radio-daily.yml
          INPUTS=""
          if [ "${{ github.event.inputs.verbose }}" = "true" ]; then
            INPUTS="$INPUTS -f verbose=true"
          fi
          if [ "${{ github.event.inputs.skip_liners }}" = "true" ]; then
            INPUTS="$INPUTS -f skip_liners=true"
          fi
          gh workflow run botiran-radio-daily.yml --repo "$REPO" $INPUTS
          sleep 15
          WORKFLOW_ID=$(gh api repos/$REPO/actions/workflows/botiran-radio-daily.yml --jq '.id')
          RUN_ID=$(gh api repos/$REPO/actions/workflows/$WORKFLOW_ID/runs --jq '.workflow_runs[0].id')
          gh run watch "$RUN_ID" --interval 20 --exit-status --repo "$REPO"

      - name: ⏱️  Execution Time Summary
        run: |
          echo "=========================================="
          echo "  ⏱️  PLAYLIST JOB TIME SUMMARY"
          echo "=========================================="
          echo "  Start: ${{ env.JOB_START_TIME }}"
          echo "  End:   $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "  Total: ~$(($(date +%s) - $(date -d "${{ env.JOB_START_TIME }}" +%s 2>/dev/null || echo 0))) seconds"
          echo "=========================================="
        env:
          JOB_START_TIME: ${{ steps.start-time.outputs.time }}
