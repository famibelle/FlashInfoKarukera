name: 🚀 Génération complète — Orchestrateur séquentiel

on:
  schedule:
    - cron: '0 3 * * *'   # 5h Paris (3h UTC)
    - cron: '0 9 * * *'   # 11h Paris (9h UTC)
    - cron: '0 15 * * *'  # 17h Paris (15h UTC)
  workflow_dispatch:
    inputs:
      verbose:
        description: "Verbose — affiche le détail de chaque étape"
        type: boolean
        required: false
        default: false
      run_horoscope:
        description: "✅ Exécuter Horoscope Quotidien"
        type: boolean
        required: false
        default: true
      run_flash_info:
        description: "✅ Exécuter Flash Info Guadeloupe"
        type: boolean
        required: false
        default: true
      run_capsules:
        description: "✅ Exécuter Capsules Culturelles"
        type: boolean
        required: false
        default: true
      run_emission:
        description: "✅ Exécuter Émission Culturelle"
        type: boolean
        required: false
        default: true
      run_playlist:
        description: "✅ Exécuter Mise à jour Playlist"
        type: boolean
        required: false
        default: true
      skip_liners:
        description: "🎙️ Skipper la génération audio des liners (TTS)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  horoscope:
    name: 🔮 Horoscope
    if: inputs.run_horoscope == true || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: ⏱️  Start Time Tracking
        id: start-time
        run: echo "time=$(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Déclencher Horoscope
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
          VERBOSE: ${{ github.event.inputs.verbose }}
        run: |
          RUN_ID=$(gh workflow run horoscope-daily.yml --repo "$REPO" --field verbose=${VERBOSE:-false} 2>&1 | grep '^{' | jq -r '.id')
          sleep 8
          gh run watch "$RUN_ID" --interval 20 --exit-status --repo "$REPO"

      - name: ⏱️  Execution Time Summary
        run: |
          echo "=========================================="
          echo "  ⏱️  HOROSCOPE JOB TIME SUMMARY"
          echo "=========================================="
          echo "  Start: ${{ env.JOB_START_TIME }}"
          echo "  End:   $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "  Total: ~$(($(date +%s) - $(date -d "${{ env.JOB_START_TIME }}" +%s 2>/dev/null || echo 0))) seconds"
          echo "=========================================="
        env:
          JOB_START_TIME: ${{ steps.start-time.outputs.time }}

  flash-info:
    name: 📰 Flash Info
    needs: horoscope
    if: inputs.run_flash_info == true || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: ⏱️  Start Time Tracking
        id: start-time
        run: echo "time=$(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Déclencher Flash Info
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
          VERBOSE: ${{ github.event.inputs.verbose }}
        run: |
          RUN_ID=$(gh workflow run flash-info.yml --repo "$REPO" --field verbose=${VERBOSE:-false} 2>&1 | grep '^{' | jq -r '.id')
          sleep 8
          gh run watch "$RUN_ID" --interval 20 --exit-status --repo "$REPO"

      - name: ⏱️  Execution Time Summary
        run: |
          echo "=========================================="
          echo "  ⏱️  FLASH INFO JOB TIME SUMMARY"
          echo "=========================================="
          echo "  Start: ${{ env.JOB_START_TIME }}"
          echo "  End:   $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "  Total: ~$(($(date +%s) - $(date -d "${{ env.JOB_START_TIME }}" +%s 2>/dev/null || echo 0))) seconds"
          echo "=========================================="
        env:
          JOB_START_TIME: ${{ steps.start-time.outputs.time }}

  capsules:
    name: 🌺 Capsules
    needs: flash-info
    if: inputs.run_capsules == true || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: ⏱️  Start Time Tracking
        id: start-time
        run: echo "time=$(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Déclencher Capsules
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
        run: |
          RUN_ID=$(gh workflow run capsules-daily.yml --repo "$REPO" 2>&1 | grep '^{' | jq -r '.id')
          sleep 8
          gh run watch "$RUN_ID" --interval 20 --exit-status --repo "$REPO"

      - name: ⏱️  Execution Time Summary
        run: |
          echo "=========================================="
          echo "  ⏱️  CAPSULES JOB TIME SUMMARY"
          echo "=========================================="
          echo "  Start: ${{ env.JOB_START_TIME }}"
          echo "  End:   $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "  Total: ~$(($(date +%s) - $(date -d "${{ env.JOB_START_TIME }}" +%s 2>/dev/null || echo 0))) seconds"
          echo "=========================================="
        env:
          JOB_START_TIME: ${{ steps.start-time.outputs.time }}

  emission:
    name: 📻 Émission
    needs: capsules
    if: inputs.run_emission == true || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: ⏱️  Start Time Tracking
        id: start-time
        run: echo "time=$(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Déclencher Émission
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
        run: |
          RUN_ID=$(gh workflow run emission-daily.yml --repo "$REPO" 2>&1 | grep '^{' | jq -r '.id')
          sleep 8
          gh run watch "$RUN_ID" --interval 20 --repo "$REPO" || true

      - name: ⏱️  Execution Time Summary
        run: |
          echo "=========================================="
          echo "  ⏱️  ÉMISSION JOB TIME SUMMARY"
          echo "=========================================="
          echo "  Start: ${{ env.JOB_START_TIME }}"
          echo "  End:   $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "  Total: ~$(($(date +%s) - $(date -d "${{ env.JOB_START_TIME }}" +%s 2>/dev/null || echo 0))) seconds"
          echo "=========================================="
        env:
          JOB_START_TIME: ${{ steps.start-time.outputs.time }}

  playlist:
    name: 🎶 Playlist
    needs: emission
    if: inputs.run_playlist == true || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: ⏱️  Start Time Tracking
        id: start-time
        run: echo "time=$(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Déclencher Playlist
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
        run: |
          # Préparer les inputs pour botiran-radio-daily.yml
          INPUTS=""
          if [ "${{ github.event.inputs.verbose }}" = "true" ]; then
            INPUTS="$INPUTS -f verbose=true"
          fi
          if [ "${{ github.event.inputs.skip_liners }}" = "true" ]; then
            INPUTS="$INPUTS -f skip_liners=true"
          fi
          RUN_ID=$(gh workflow run botiran-radio-daily.yml --repo "$REPO" $INPUTS 2>&1 | grep '^{' | jq -r '.id')
          sleep 8
          gh run watch "$RUN_ID" --interval 20 --exit-status --repo "$REPO"

      - name: ⏱️  Execution Time Summary
        run: |
          echo "=========================================="
          echo "  ⏱️  PLAYLIST JOB TIME SUMMARY"
          echo "=========================================="
          echo "  Start: ${{ env.JOB_START_TIME }}"
          echo "  End:   $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "  Total: ~$(($(date +%s) - $(date -d "${{ env.JOB_START_TIME }}" +%s 2>/dev/null || echo 0))) seconds"
          echo "=========================================="
        env:
          JOB_START_TIME: ${{ steps.start-time.outputs.time }}
