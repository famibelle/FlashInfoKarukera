name: Horoscope Quotidien

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Édition : matin ou soir (laisser vide pour auto selon l'heure)"
        required: false
        default: ""
      date:
        description: "Date (YYYY-MM-DD) — laisser vide pour aujourd'hui"
        required: false
        default: ""
      horoscope_signs:
        description: "Nombre de signes (défaut : 7)"
        type: integer
        required: false
        default: 3
      horoscope_include:
        description: "Forcer un ou plusieurs signes (noms anglais séparés par des espaces, ex: gemini capricorn)"
        required: false
        default: ""
      tiktok:
        description: "Génère les vidéos TikTok/Shorts et les envoie sur Telegram"
        type: boolean
        required: false
        default: true
      verbose:
        description: "Verbose (affiche le détail de chaque étape)"
        type: boolean
        required: false
        default: true
      overwrite:
        description: "Overwrite les fichiers JSON et MP3 existants"
        type: boolean
        required: false
        default: false

concurrency:
  group: horoscope-daily-${{ github.event.inputs.date || 'daily' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  horoscope:
    name: 🔮 Générer Horoscope
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: ⏱️  Start Time Tracking
        id: start-time
        run: echo "time=$(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Configurer les credentials git pour le submodule privé
        run: git config --global url."https://${{ secrets.PAT_SUBMODULE }}@github.com/".insteadOf "https://github.com/"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_SUBMODULE }}
          submodules: true

      - name: Installer FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Installer polices emoji
        run: sudo apt-get install -y fonts-noto-color-emoji

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Détecter l'édition
        id: edition
        run: |
          EDITION="${{ github.event.inputs.edition }}"
          if [ -z "$EDITION" ]; then
            HOUR=$(date -u +%H)
            if [ "$HOUR" -lt 5 ]; then
              EDITION="soir"  # nuit = soir de la veille
            elif [ "$HOUR" -lt 12 ]; then
              EDITION="matin"
            elif [ "$HOUR" -lt 17 ]; then
              EDITION="midi"
            else
              EDITION="soir"
            fi
          fi
          echo "EDITION=$EDITION" >> $GITHUB_ENV
          echo "Édition détectée : $EDITION"

      - name: Déterminer la date cible
        id: target_date
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(date -u +%Y-%m-%d)
          fi
          echo "TARGET_DATE=$DATE" >> $GITHUB_ENV
          echo "Date cible : $DATE"

      - name: Vérifier si horoscope existe déjà
        id: check_horoscope
        run: |
          # Vérifier l'édition ciblée uniquement
          FILE_MATIN="docs/audio/horoscope/horoscope-${{ env.TARGET_DATE }}-matin.mp3"
          FILE_MIDI="docs/audio/horoscope/horoscope-${{ env.TARGET_DATE }}-midi.mp3"
          FILE_SOIR="docs/audio/horoscope/horoscope-${{ env.TARGET_DATE }}-soir.mp3"
          FILE_GENERIC="docs/audio/horoscope/horoscope-${{ env.TARGET_DATE }}.mp3"
          
          if [ "${{ github.event.inputs.overwrite }}" = "true" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "file_found=false" >> $GITHUB_OUTPUT
          elif [ "${{ env.EDITION }}" = "matin" ] && [ -f "$FILE_MATIN" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "file_found=true" >> $GITHUB_OUTPUT
            echo "file_path=$FILE_MATIN" >> $GITHUB_OUTPUT
          elif [ "${{ env.EDITION }}" = "midi" ] && [ -f "$FILE_MIDI" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "file_found=true" >> $GITHUB_OUTPUT
            echo "file_path=$FILE_MIDI" >> $GITHUB_OUTPUT
          elif [ "${{ env.EDITION }}" = "soir" ] && [ -f "$FILE_SOIR" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "file_found=true" >> $GITHUB_OUTPUT
            echo "file_path=$FILE_SOIR" >> $GITHUB_OUTPUT
          elif [ -f "$FILE_GENERIC" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "file_found=true" >> $GITHUB_OUTPUT
            echo "file_path=$FILE_GENERIC" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "file_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Préparer les arguments
        id: args
        run: |
          ARGS="--edition ${{ env.EDITION }}"
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          HOROSCOPE_SIGNS="${{ github.event.inputs.horoscope_signs }}"
          HOROSCOPE_SIGNS="${HOROSCOPE_SIGNS:-7}"
          ARGS="$ARGS --horoscope-signs $HOROSCOPE_SIGNS"
          HOROSCOPE_INCLUDE="${{ github.event.inputs.horoscope_include }}"
          if [ -n "$HOROSCOPE_INCLUDE" ]; then
            ARGS="$ARGS --horoscope-include $HOROSCOPE_INCLUDE"
          fi
          TIKTOK_INPUT="${{ github.event.inputs.tiktok }}"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$TIKTOK_INPUT" = "true" ] || [ -z "$TIKTOK_INPUT" ]; then
            ARGS="$ARGS --tiktok"
          fi
          ARGS="$ARGS --telegram"
          if [ "${{ github.event.inputs.verbose }}" = "true" ]; then
            ARGS="$ARGS --verbose"
          fi
          if [ "${{ github.event.inputs.overwrite }}" = "true" ]; then
            ARGS="$ARGS --overwrite"
          fi
          echo "HORO_ARGS=$ARGS" >> $GITHUB_ENV
          echo "Arguments : $ARGS"

      - name: Générer l'horoscope
        if: steps.check_horoscope.outputs.exists != 'true'
        env:
          MISTRAL_API_KEY:       ${{ secrets.MISTRAL_API_KEY }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
          BUZZSPROUT_API_TOKEN:  ${{ secrets.BUZZSPROUT_API_TOKEN }}
          BUZZSPROUT_PODCAST_ID: ${{ secrets.BUZZSPROUT_PODCAST_ID }}
          B2_KEY_ID:             ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY:    ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME:        ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT:           ${{ secrets.B2_ENDPOINT }}
          ARCHIVE_ACCESS_KEY:         ${{ secrets.ARCHIVE_ACCESS_KEY }}
          ARCHIVE_SECRET_KEY:         ${{ secrets.ARCHIVE_SECRET_KEY }}
          GITHUB_TOKEN:               ${{ secrets.GITHUB_TOKEN }}
        run: python -u horoscope-gwada.py ${{ env.HORO_ARGS }}

      - name: 📁 Héberger les MP3 horoscope dans docs/audio/
        if: steps.check_horoscope.outputs.exists != 'true'
        run: python patch_podcast_audio.py horoscope

      - name: Sauvegarder l'anti-répétition flore et les archives
        if: steps.check_horoscope.outputs.exists != 'true'
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions [Horoscope]"
          git pull origin main --no-rebase -X ours --no-edit 2>/dev/null || true
          git add data/used_flora.json archives/horoscope/
          git add docs/audio/horoscope/
          git add docs/podcast.xml
          git add docs/horoscope.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: horoscope ${{ env.TARGET_DATE }} — archive + flore + RSS [skip ci]"
            for attempt in 1 2 3; do
              git push && break
              echo "⚠️  Push échoué (tentative $attempt/3), sync et retry…"
              sleep $((RANDOM % 10 + 5))
              git pull origin main --rebase -X ours --no-edit
            done
          else
            echo "Aucun changement à commiter"
          fi

      - name: 🚀 Déclencher le déploiement GitHub Pages
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}

      - name: ⏱️  Execution Time Summary
        run: |
          echo "=========================================="
          echo "  ⏱️  HOROSCOPE JOB TIME SUMMARY"
          echo "=========================================="
          echo "  Start: ${{ env.JOB_START_TIME }}"
          echo "  End:   $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "  Total: ~$(($(date +%s) - $(date -d "${{ env.JOB_START_TIME }}" +%s 2>/dev/null || echo 0))) seconds"
          echo "=========================================="
        env:
          JOB_START_TIME: ${{ steps.start-time.outputs.time }}
