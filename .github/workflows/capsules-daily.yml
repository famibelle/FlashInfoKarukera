name: Capsules Culturelles Quotidiennes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-capsules:
    name: 🌺 Générer Capsules
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configurer les credentials git pour le submodule privé
        run: git config --global url."https://${{ secrets.PAT_SUBMODULE }}@github.com/".insteadOf "https://github.com/"

      - name: Checkout code et submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_SUBMODULE }}
          submodules: true

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer toutes les capsules pour la journée
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          # Générer les capsules pour tous les slots
          # Slots : matin-0, matin-6, matin-12, matin-18, midi-0, midi-6, midi-12, midi-18, midi-24, soir-0, etc.
          ARGS="--generate-capsules-only"
          if [ "${{ github.event.inputs.verbose }}" = "true" ]; then
            ARGS="$ARGS --verbose"
          fi
          python generate_radio_sequence.py $ARGS

      - name: Commit les capsules générées
        run: |
          git config user.name "github-actions[Capsules]"
          git config user.email "github-actions@github.com"
          git add docs/capsules/ playlists/youtube_cache.json
          git diff --cached --quiet || git commit -m "feat: capsules culturelles quotidiennes [skip ci]"
          git stash --include-untracked || true
          git pull --rebase -X theirs origin main
          git stash drop 2>/dev/null || true
          git push
ll || true
          git push
