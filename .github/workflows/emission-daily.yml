name: Émission Culturelle Quotidienne

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-emission:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configurer les credentials git pour le submodule privé
        run: git config --global url."https://${{ secrets.PAT_SUBMODULE }}@github.com/".insteadOf "https://github.com/"

      - name: Checkout code et submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_SUBMODULE }}
          submodules: true

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer l'émission culturelle quotidienne
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python generate_emission.py

      - name: Commit l'émission générée
        run: |
          git config user.name "github-actions[Émission]"
          git config user.email "github-actions@github.com"
          git add docs/audio/Emissions/emission-*.mp3 docs/audio/Emissions/emission-*.json
          git diff --cached --quiet || git commit -m "feat: émission culturelle quotidienne [skip ci]"
          git pull --rebase origin main
          git push
