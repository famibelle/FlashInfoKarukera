name: Émission Culturelle Quotidienne

on:
  schedule:
    - cron: "30 16 * * *"  # soir  : 16h30 UTC (18h30 Paris)
  workflow_dispatch:
    inputs:
      edition:
        description: "Édition (matin ou soir)"
        type: choice
        options: ["matin", "soir"]
        required: false
        default: "matin"
      verbose:
        description: "Mode verbeux (affiche prompts LLM)"
        type: boolean
        required: false
        default: true
      overwrite:
        description: "Overwrite les fichiers MP3 et JSON existants"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  generate-emission:
    name: 📻 Générer Émission
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⏱️  Start Time Tracking
        id: start-time
        run: echo "time=$(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Configurer les credentials git pour le submodule privé
        run: git config --global url."https://${{ secrets.PAT_SUBMODULE }}@github.com/".insteadOf "https://github.com/"

      - name: Checkout code et submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_SUBMODULE }}
          submodules: true

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Installer FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Déterminer l'édition
        id: edition
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR=$(date -u +%H)
            if [ "$HOUR" -lt 12 ]; then
              echo "value=matin" >> $GITHUB_OUTPUT
            else
              echo "value=soir" >> $GITHUB_OUTPUT
            fi
          else
            echo "value=${{ github.event.inputs.edition || 'matin' }}" >> $GITHUB_OUTPUT
          fi

      - name: Vérifier si émission existe déjà
        id: check_emission
        run: |
          EDITION="${{ steps.edition.outputs.value }}"
          EMISSION_FILE="docs/audio/Emissions/emission-$(date -u +%Y-%m-%d)-${EDITION}.mp3"
          if [ "${{ github.event.inputs.overwrite }}" = "true" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
          elif [ -f "$EMISSION_FILE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Générer l'émission culturelle
        if: steps.check_emission.outputs.exists != 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          ARGS="--edition ${{ steps.edition.outputs.value }}"
          if [ "${{ github.event.inputs.verbose }}" = "true" ]; then ARGS="$ARGS --verbose"; fi
          if [ "${{ github.event.inputs.overwrite }}" = "true" ]; then ARGS="$ARGS --overwrite"; fi
          python generate_emission.py $ARGS

      - name: Commit l'émission générée
        if: steps.check_emission.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[Émission]"
          git config user.email "github-actions@github.com"
          git pull origin main --no-rebase -X ours --no-edit 2>/dev/null || true
          git add docs/audio/Emissions/emission-*.mp3 docs/audio/Emissions/emission-*.json
          git add archives/emissions/ docs/podcast.xml docs/emissions.xml
          if ! git diff --cached --quiet; then
            git commit -m "feat: émission culturelle ${{ steps.edition.outputs.value }} $(date -u +%Y-%m-%d) [skip ci]"
            for attempt in 1 2 3; do
              git push && break
              echo "⚠️  Push échoué (tentative $attempt/3), sync et retry…"
              sleep $((RANDOM % 10 + 5))
              git pull origin main --rebase -X ours --no-edit
            done
          fi

      - name: 🚀 Déclencher le déploiement GitHub Pages
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}

      - name: ⏱️  Execution Time Summary
        run: |
          echo "=========================================="
          echo "  ⏱️  ÉMISSION JOB TIME SUMMARY"
          echo "=========================================="
          echo "  Édition : ${{ steps.edition.outputs.value }}"
          echo "  Start: ${{ steps.start-time.outputs.time }}"
          echo "  End:   $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
