name: Émission Culturelle Quotidienne

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: "Mode verbeux (affiche prompts LLM)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  generate-emission:
    name: 📻 Générer Émission
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⏱️  Start Time Tracking
        id: start-time
        run: echo "time=$(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Configurer les credentials git pour le submodule privé
        run: git config --global url."https://${{ secrets.PAT_SUBMODULE }}@github.com/".insteadOf "https://github.com/"

      - name: Checkout code et submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_SUBMODULE }}
          submodules: true

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Installer FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Générer l'émission culturelle quotidienne
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python generate_emission.py ${{
            github.event.inputs.verbose == 'true' && '--verbose' || ''
          }}

      - name: Commit l'émission générée
        run: |
          git config user.name "github-actions[Émission]"
          git config user.email "github-actions@github.com"
          git add docs/audio/Emissions/emission-*.mp3 docs/audio/Emissions/emission-*.json docs/podcast.xml
          git diff --cached --quiet || git commit -m "feat: émission culturelle quotidienne [skip ci]"
          git stash --include-untracked || true
          git pull --rebase -X theirs origin main
          git stash drop 2>/dev/null || true
          git push

      - name: ⏱️  Execution Time Summary
        run: |
          echo "=========================================="
          echo "  ⏱️  ÉMISSION JOB TIME SUMMARY"
          echo "=========================================="
          echo "  Start: ${{ env.JOB_START_TIME }}"
          echo "  End:   $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "  Total: ~$(($(date +%s) - $(date -d "${{ env.JOB_START_TIME }}" +%s 2>/dev/null || echo 0))) seconds"
          echo "=========================================="
        env:
          JOB_START_TIME: ${{ steps.start-time.outputs.time }}
