name: Émission Culturelle Quotidienne

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: "Mode verbeux (affiche prompts LLM)"
        type: boolean
        required: false
        default: true
      overwrite:
        description: "Overwrite les fichiers MP3 et JSON existants"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  generate-emission:
    name: 📻 Générer Émission
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⏱️  Start Time Tracking
        id: start-time
        run: echo "time=$(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Configurer les credentials git pour le submodule privé
        run: git config --global url."https://${{ secrets.PAT_SUBMODULE }}@github.com/".insteadOf "https://github.com/"

      - name: Checkout code et submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_SUBMODULE }}
          submodules: true

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Installer FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Vérifier si émission existe déjà
        id: check_emission
        run: |
          EMMISSION_FILE="docs/audio/Emissions/emission-$(date -u +%Y-%m-%d).mp3"
          if [ "${{ github.event.inputs.overwrite }}" = "true" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
          elif [ -f "$EMISSION_FILE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Générer l'émission culturelle quotidienne
        if: steps.check_emission.outputs.exists != 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python generate_emission.py ${{
            github.event.inputs.verbose == 'true' && '--verbose' || ''
          }} ${{
            github.event.inputs.overwrite == 'true' && '--overwrite' || ''
          }}

      - name: Commit l'émission générée
        if: steps.check_emission.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[Émission]"
          git config user.email "github-actions@github.com"
          git pull origin main --no-rebase -X ours --no-edit 2>/dev/null || true
          git add docs/audio/Emissions/emission-*.mp3 docs/audio/Emissions/emission-*.json docs/podcast.xml
          if ! git diff --cached --quiet; then
            git commit -m "feat: émission culturelle quotidienne [skip ci]"
            git push || (git pull origin main --rebase -X ours --no-edit && git push)
          fi

      - name: ⏱️  Execution Time Summary
        run: |
          echo "=========================================="
          echo "  ⏱️  ÉMISSION JOB TIME SUMMARY"
          echo "=========================================="
          echo "  Start: ${{ env.JOB_START_TIME }}"
          echo "  End:   $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "  Total: ~$(($(date +%s) - $(date -d "${{ env.JOB_START_TIME }}" +%s 2>/dev/null || echo 0))) seconds"
          echo "=========================================="
        env:
          JOB_START_TIME: ${{ steps.start-time.outputs.time }}
