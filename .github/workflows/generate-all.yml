name: 🚀 Génération complète — Orchestrateur séquentiel

on:
  schedule:
    - cron: '0 4 * * *'   # 4h UTC
    - cron: '0 11 * * *'  # 11h UTC
    - cron: '0 17 * * *'  # 17h UTC
  workflow_dispatch:
    inputs:
      verbose:
        description: "Verbose — affiche le détail de chaque étape"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # 1️⃣ Horoscope (premier, car utilisé par Flash Info)
  horoscope:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher Horoscope Quotidien
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
          VERBOSE: ${{ github.event.inputs.verbose }}
        run: |
          FIELDS="--field verbose=${VERBOSE:-false}"
          gh workflow run horoscope-daily.yml --repo "$REPO" $FIELDS
          sleep 8
          RUN_ID=$(gh run list --workflow=horoscope-daily.yml --repo "$REPO" \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "▶️  Horoscope run #$RUN_ID (verbose=${VERBOSE:-false})"
          gh run watch "$RUN_ID" --interval 20 --exit-status --repo "$REPO"

  # 2️⃣ Flash Info (après horoscope)
  flash-info:
    needs: horoscope  # ✅ SÉQUENTIEL : attend horoscope
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher Flash Info Guadeloupe
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
          VERBOSE: ${{ github.event.inputs.verbose }}
        run: |
          FIELDS="--field verbose=${VERBOSE:-false}"
          gh workflow run flash-info.yml --repo "$REPO" $FIELDS
          sleep 8
          RUN_ID=$(gh run list --workflow=flash-info.yml --repo "$REPO" \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "▶️  Flash Info run #$RUN_ID (verbose=${VERBOSE:-false})"
          gh run watch "$RUN_ID" --interval 20 --exit-status --repo "$REPO"

  # 3️⃣ Liners (après flash info)
  liners:
    needs: flash-info  # ✅ SÉQUENTIEL : attend flash info
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher Liners Quotidiens
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run liners-daily.yml --repo "$REPO"
          sleep 8
          RUN_ID=$(gh run list --workflow=liners-daily.yml --repo "$REPO" \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "▶️  Liners run #$RUN_ID"
          gh run watch "$RUN_ID" --interval 20 --exit-status --repo "$REPO"

  # 4️⃣ Capsules (après liners)
  capsules:
    needs: liners  # ✅ SÉQUENTIEL : attend liners
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher Capsules Culturelles
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run capsules-daily.yml --repo "$REPO"
          sleep 8
          RUN_ID=$(gh run list --workflow=capsules-daily.yml --repo "$REPO" \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "▶️  Capsules run #$RUN_ID"
          gh run watch "$RUN_ID" --interval 20 --exit-status --repo "$REPO"

  # 5️⃣ Émission (après capsules) → NON BLOQUANT
  emission:
    needs: capsules
    runs-on: ubuntu-latest
    continue-on-error: true  # ✅ Échec toléré, ne bloque pas la suite
    steps:
      - name: Déclencher Émission Culturelle
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run emission-daily.yml --repo "$REPO"
          sleep 8
          RUN_ID=$(gh run list --workflow=emission-daily.yml --repo "$REPO" \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "▶️  Émission run #$RUN_ID (non bloquant)"
          gh run watch "$RUN_ID" --interval 20 --repo "$REPO" || true

  # 6️⃣ Interview (après capsules) → NON BLOQUANT - DÉSACTIVÉ TEMPORAIREMENT
  # interview:
  #   needs: capsules
  #   runs-on: ubuntu-latest
  #   continue-on-error: true  # ✅ Échec toléré, ne bloque pas la suite
  #   steps:
  #     - name: Déclencher Interview Radio
  #       env:
  #         GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
  #         REPO: ${{ github.repository }}
  #       run: |
  #         gh workflow run interview-daily.yml --repo "$REPO"
  #         sleep 8
  #         RUN_ID=$(gh run list --workflow=interview-daily.yml --repo "$REPO" \
  #           --limit 1 --json databaseId --jq '.[0].databaseId')
  #         echo "▶️  Interview run #$RUN_ID (non bloquant)"
  #         gh run watch "$RUN_ID" --interval 20 --repo "$REPO" || true

  # 7️⃣ Playlist (après capsules + émission) → DERNIER
  playlist:
    needs: [capsules, emission]  # ✅ Attend capsules + émission (non bloquant)
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher mise à jour playlist radio
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run botiran-radio-daily.yml --repo "$REPO"
          sleep 8
          RUN_ID=$(gh run list --workflow=botiran-radio-daily.yml --repo "$REPO" \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "▶️  Playlist run #$RUN_ID (DERNIER)"
          gh run watch "$RUN_ID" --interval 20 --exit-status --repo "$REPO"
