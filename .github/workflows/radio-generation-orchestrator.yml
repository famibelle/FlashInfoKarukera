name: 🚀 Génération complète — Orchestrateur séquentiel

on:
  schedule:
    - cron: '0 3 * * *'   # 5h Paris (3h UTC)
    - cron: '0 9 * * *'   # 11h Paris (9h UTC)
    - cron: '0 15 * * *'  # 17h Paris (15h UTC)
  workflow_dispatch:
    inputs:
      verbose:
        description: "Verbose — affiche le détail de chaque étape (FORCE_REGEN_2)"
        type: boolean
        required: false
        default: false
      force_regen:
        description: "Force regeneration workflow ID"
        type: boolean
        required: false
        default: false
      run_horoscope:
        description: "✅ Exécuter Horoscope Quotidien"
        type: boolean
        required: false
        default: true
      run_flash_info:
        description: "✅ Exécuter Flash Info Guadeloupe"
        type: boolean
        required: false
        default: true
      run_capsules:
        description: "✅ Exécuter Capsules Culturelles"
        type: boolean
        required: false
        default: true
      run_emission:
        description: "✅ Exécuter Émission Culturelle"
        type: boolean
        required: false
        default: true
      run_playlist:
        description: "✅ Exécuter Mise à jour Playlist"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  # 1️⃣ Horoscope (premier, car utilisé par Flash Info)
  horoscope:
    name: 🔮 Horoscope
    if: inputs.run_horoscope == true || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: ⏱️ Début Horoscope
        id: start
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
          echo "::notice title=⏳ Horoscope::Début à $(date -Iseconds)"

      - name: Déclencher Horoscope Quotidien
        id: trigger
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
          VERBOSE: ${{ github.event.inputs.verbose }}
        run: |
          TRIGGER_START=$(date +%s)
          echo "::notice title=🔮 Horoscope::[1/2] Déclenchement workflow..."
          FIELDS="--field verbose=${VERBOSE:-false}"
          gh workflow run horoscope-daily.yml --repo "$REPO" $FIELDS
          sleep 8
          RUN_ID=$(gh run list --workflow=horoscope-daily.yml --repo "$REPO" \
            --limit 1 --json databaseId,status --jq '.[0] | "\(.databaseId)|\(.status)"')
          RUN_ID=${RUN_ID%|*}
          STATUS=${RUN_ID#*|}
          TRIGGER_DURATION=$(( $(date +%s) - TRIGGER_START ))
          echo "::notice title=🔮 Horoscope::[1/2] ✅ Workflow #$RUN_ID déclenché en ${TRIGGER_DURATION}s (status: $STATUS)"

      - name: Attendre fin Horoscope
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
        run: |
          WATCH_START=$(date +%s)
          echo "::notice title=🔮 Horoscope::[2/2] Surveillance exécution..."
          gh run watch "$RUN_ID" --interval 20 --exit-status --repo "$REPO"
          WATCH_DURATION=$(( $(date +%s) - WATCH_START ))
          echo "::notice title=✅ Horoscope::[2/2] Terminé en ${WATCH_DURATION}s"
          echo "horoscope_duration=${WATCH_DURATION}" >> $GITHUB_OUTPUT

      - name: ⏱️ Fin Horoscope
        run: |
          JOB_DURATION=$(( $(date +%s) - ${START_TIME} ))
          echo "::notice title=✅ Horoscope::Job terminé en ${JOB_DURATION}s"
          echo "horoscope_total=${JOB_DURATION}" >> $GITHUB_ENV

  # 2️⃣ Flash Info
  flash-info:
    name: 📰 Flash Info
    needs: horoscope
    if: inputs.run_flash_info == true || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: ⏱️ Début Flash Info (après Horoscope: ${{ env.horoscope_total }}s)
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
          echo "::notice title=⏳ Flash Info::Début à $(date -Iseconds) (Horoscope: ${{ env.horoscope_total }}s)"

      - name: Déclencher Flash Info Guadeloupe
        id: trigger
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
          VERBOSE: ${{ github.event.inputs.verbose }}
        run: |
          TRIGGER_START=$(date +%s)
          echo "::notice title=📰 Flash Info::[1/2] Déclenchement workflow..."
          FIELDS="--field verbose=${VERBOSE:-false}"
          gh workflow run flash-info.yml --repo "$REPO" $FIELDS
          sleep 8
          RUN_ID=$(gh run list --workflow=flash-info.yml --repo "$REPO" \
            --limit 1 --json databaseId,status --jq '.[0] | "\(.databaseId)|\(.status)"')
          RUN_ID=${RUN_ID%|*}
          STATUS=${RUN_ID#*|}
          TRIGGER_DURATION=$(( $(date +%s) - TRIGGER_START ))
          echo "::notice title=📰 Flash Info::[1/2] ✅ Workflow #$RUN_ID déclenché en ${TRIGGER_DURATION}s (status: $STATUS)"

      - name: Attendre fin Flash Info
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
        run: |
          WATCH_START=$(date +%s)
          echo "::notice title=📰 Flash Info::[2/2] Surveillance exécution..."
          gh run watch "$RUN_ID" --interval 20 --exit-status --repo "$REPO"
          WATCH_DURATION=$(( $(date +%s) - WATCH_START ))
          echo "::notice title=✅ Flash Info::[2/2] Terminé en ${WATCH_DURATION}s"
          echo "flash_info_duration=${WATCH_DURATION}" >> $GITHUB_OUTPUT

      - name: ⏱️ Fin Flash Info
        run: |
          JOB_DURATION=$(( $(date +%s) - ${START_TIME} ))
          echo "::notice title=✅ Flash Info::Job terminé en ${JOB_DURATION}s"
          echo "flash_info_total=${JOB_DURATION}" >> $GITHUB_ENV

  # 3️⃣ Capsules
  capsules:
    name: 🌺 Capsules
    needs: flash-info
    if: inputs.run_capsules == true || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: ⏱️ Début Capsules (après Flash Info: ${{ env.flash_info_total }}s)
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
          echo "::notice title=⏳ Capsules::Début à $(date -Iseconds) (Flash Info: ${{ env.flash_info_total }}s)"

      - name: Déclencher Capsules Culturelles
        id: trigger
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
        run: |
          TRIGGER_START=$(date +%s)
          echo "::notice title=🌺 Capsules::[1/2] Déclenchement workflow..."
          gh workflow run capsules-daily.yml --repo "$REPO"
          sleep 8
          RUN_ID=$(gh run list --workflow=capsules-daily.yml --repo "$REPO" \
            --limit 1 --json databaseId,status --jq '.[0] | "\(.databaseId)|\(.status)"')
          RUN_ID=${RUN_ID%|*}
          STATUS=${RUN_ID#*|}
          TRIGGER_DURATION=$(( $(date +%s) - TRIGGER_START ))
          echo "::notice title=🌺 Capsules::[1/2] ✅ Workflow #$RUN_ID déclenché en ${TRIGGER_DURATION}s (status: $STATUS)"

      - name: Attendre fin Capsules
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
        run: |
          WATCH_START=$(date +%s)
          echo "::notice title=🌺 Capsules::[2/2] Surveillance exécution..."
          gh run watch "$RUN_ID" --interval 20 --exit-status --repo "$REPO"
          WATCH_DURATION=$(( $(date +%s) - WATCH_START ))
          echo "::notice title=✅ Capsules::[2/2] Terminé en ${WATCH_DURATION}s"
          echo "capsules_duration=${WATCH_DURATION}" >> $GITHUB_OUTPUT

      - name: ⏱️ Fin Capsules
        run: |
          JOB_DURATION=$(( $(date +%s) - ${START_TIME} ))
          echo "::notice title=✅ Capsules::Job terminé en ${JOB_DURATION}s"
          echo "capsules_total=${JOB_DURATION}" >> $GITHUB_ENV

  # 4️⃣ Émission → NON BLOQUANT
  emission:
    name: 📻 Émission
    needs: capsules
    if: inputs.run_emission == true || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true  # ✅ Échec toléré, ne bloque pas la suite
    steps:
      - name: ⏱️ Début Émission (après Capsules: ${{ env.capsules_total }}s)
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
          echo "::notice title=⏳ Émission::Début à $(date -Iseconds) (Capsules: ${{ env.capsules_total }}s)"

      - name: Déclencher Émission Culturelle
        id: trigger
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
        run: |
          TRIGGER_START=$(date +%s)
          echo "::notice title=📻 Émission::[1/2] Déclenchement workflow (NON BLOQUANT)..."
          gh workflow run emission-daily.yml --repo "$REPO"
          sleep 8
          RUN_ID=$(gh run list --workflow=emission-daily.yml --repo "$REPO" \
            --limit 1 --json databaseId,status --jq '.[0] | "\(.databaseId)|\(.status)"')
          RUN_ID=${RUN_ID%|*}
          STATUS=${RUN_ID#*|}
          TRIGGER_DURATION=$(( $(date +%s) - TRIGGER_START ))
          echo "::notice title=📻 Émission::[1/2] ✅ Workflow #$RUN_ID déclenché en ${TRIGGER_DURATION}s (status: $STATUS)"

      - name: Attendre fin Émission
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
        run: |
          WATCH_START=$(date +%s)
          echo "::notice title=📻 Émission::[2/2] Surveillance exécution..."
          gh run watch "$RUN_ID" --interval 20 --repo "$REPO" || true
          WATCH_DURATION=$(( $(date +%s) - WATCH_START ))
          echo "::notice title=✅ Émission::[2/2] Terminé en ${WATCH_DURATION}s (toléré: ${{ job.status }})"
          echo "emission_duration=${WATCH_DURATION}" >> $GITHUB_OUTPUT

      - name: ⏱️ Fin Émission
        run: |
          JOB_DURATION=$(( $(date +%s) - ${START_TIME} ))
          echo "::notice title=✅ Émission::Job terminé en ${JOB_DURATION}s (NON BLOQUANT)"
          echo "emission_total=${JOB_DURATION}" >> $GITHUB_ENV

  # 5️⃣ Interview (après capsules) → NON BLOQUANT - DÉSACTIVÉ TEMPORAIREMENT
  # interview:
  #   needs: capsules
  #   runs-on: ubuntu-latest
  #   continue-on-error: true  # ✅ Échec toléré, ne bloque pas la suite
  #   steps:
  #     - name: Déclencher Interview Radio
  #       env:
  #         GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
  #         REPO: ${{ github.repository }}
  #       run: |
  #         gh workflow run interview-daily.yml --repo "$REPO"
  #         sleep 8
  #         RUN_ID=$(gh run list --workflow=interview-daily.yml --repo "$REPO" \
  #           --limit 1 --json databaseId --jq '.[0].databaseId')
  #         echo "▶️  Interview run #$RUN_ID (non bloquant)"
  #         gh run watch "$RUN_ID" --interval 20 --repo "$REPO" || true

  # 6️⃣ Playlist → DERNIER
  playlist:
    name: 🎶 Playlist
    needs: emission
    if: inputs.run_playlist == true || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: ⏱️ Début Playlist (après Émission: ${{ env.emission_total }}s)
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
          echo "::notice title=⏳ Playlist::Début à $(date -Iseconds) (Émission: ${{ env.emission_total }}s)"

      - name: Déclencher mise à jour playlist radio
        id: trigger
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
        run: |
          TRIGGER_START=$(date +%s)
          echo "::notice title=🎶 Playlist::[1/2] Déclenchement workflow..."
          gh workflow run botiran-radio-daily.yml --repo "$REPO"
          sleep 8
          RUN_ID=$(gh run list --workflow=botiran-radio-daily.yml --repo "$REPO" \
            --limit 1 --json databaseId,status --jq '.[0] | "\(.databaseId)|\(.status)"')
          RUN_ID=${RUN_ID%|*}
          STATUS=${RUN_ID#*|}
          TRIGGER_DURATION=$(( $(date +%s) - TRIGGER_START ))
          echo "::notice title=🎶 Playlist::[1/2] ✅ Workflow #$RUN_ID déclenché en ${TRIGGER_DURATION}s (status: $STATUS)"

      - name: Attendre fin Playlist
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE }}
          REPO: ${{ github.repository }}
        run: |
          WATCH_START=$(date +%s)
          echo "::notice title=🎶 Playlist::[2/2] Surveillance exécution..."
          gh run watch "$RUN_ID" --interval 20 --exit-status --repo "$REPO"
          WATCH_DURATION=$(( $(date +%s) - WATCH_START ))
          echo "::notice title=✅ Playlist::[2/2] Terminé en ${WATCH_DURATION}s"
          echo "playlist_duration=${WATCH_DURATION}" >> $GITHUB_OUTPUT

      - name: ⏱️ Fin Playlist + Récapitulatif
        run: |
          JOB_DURATION=$(( $(date +%s) - ${START_TIME} ))
          echo "::notice title=✅ Playlist::Job terminé en ${JOB_DURATION}s"
          echo "playlist_total=${JOB_DURATION}" >> $GITHUB_ENV
          
          # Récapitulatif final
          TOTAL=$(( ${horoscope_total:-0} + ${flash_info_total:-0} + ${capsules_total:-0} + ${emission_total:-0} + ${playlist_total:-0} ))
          echo "::notice title=📊 RÉCAPITULATIF::============================"
          echo "::notice title=📊 RÉCAPITULATIF::Horoscope:    ${{ env.horoscope_total }}s"
          echo "::notice title=📊 RÉCAPITULATIF::Flash Info:   ${{ env.flash_info_total }}s"
          echo "::notice title=📊 RÉCAPITULATIF::Capsules:     ${{ env.capsules_total }}s"
          echo "::notice title=📊 RÉCAPITULATIF::Émission:      ${{ env.emission_total }}s (non bloquant)"
          echo "::notice title=📊 RÉCAPITULATIF::Playlist:     ${JOB_DURATION}s"
          echo "::notice title=📊 RÉCAPITULATIF::TOTAL:        ${TOTAL}s (~$(printf '%.1f' $(echo "$TOTAL/60" | bc -l))min)"
          echo "::notice title=📊 RÉCAPITULATIF::============================"
