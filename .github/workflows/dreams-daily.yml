name: Rêves Nocturnes Quotidiens

on:
  schedule:
    - cron: '0 0 * * *'    # 00:00 UTC = 01:00 Paris (heure d'hiver, UTC+1)
    - cron: '0 23 * * *'   # 23:00 UTC = 01:00 Paris (heure d'été, UTC+2)
  workflow_dispatch:
    inputs:
      date:
        description: "Date au format YYYY-MM-DD (défaut: aujourd'hui)"
        type: string
        required: false
      llm-key:
        description: "Clé API Mistral (optionnel, utilise le secret MISTRAL_API_KEY par défaut)"
        type: string
        required: false
      no-github:
        description: "Désactiver l'API GitHub"
        type: boolean
        required: false
        default: false
      dry-run:
        description: "Mode dry-run (affichage seulement, pas de sauvegarde)"
        type: boolean
        required: false
        default: false
      verbose:
        description: "Mode verbeux (affiche le détail de chaque étape)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  generate-dreams:
    name: Générer les rêves
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv requests

      - name: Générer les rêves
        env:
          MISTRAL_API_KEY: ${{ github.event.inputs.llm-key || secrets.MISTRAL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_SUBMODULE || secrets.GITHUB_TOKEN }}
          DATE: ${{ github.event.inputs.date || '' }}
          NO_GITHUB: ${{ github.event.inputs.no-github == 'true' && '--no-github' || '' }}
          DRY_RUN: ${{ github.event.inputs.dry-run == 'true' && '--dry-run' || '' }}
        run: |
          CMD="python scripts/dream_radio.py"
          [ -n "$DATE" ] && CMD="$CMD --date $DATE"
          [ -n "$MISTRAL_API_KEY" ] && CMD="$CMD --llm-key $MISTRAL_API_KEY"
          [ -n "$NO_GITHUB" ] && CMD="$CMD $NO_GITHUB"
          [ -n "$DRY_RUN" ] && CMD="$CMD $DRY_RUN"

          echo "🚀 Exécution : $CMD"
          eval $CMD

      - name: Commiter les fichiers générés
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry-run != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_SUBMODULE || secrets.GITHUB_TOKEN }}
        run: |
          # Vérifier si des fichiers rêves ont été modifiés
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ajouter les fichiers de rêves s'ils existent
          REVES_CHANGED=$(git status --porcelain docs/reves/ | wc -l)
          if [ "$REVES_CHANGED" -gt 0 ]; then
            git add docs/reves/
            git commit -m "docs: rêve quotidien $(date -u +%Y-%m-%d) [skip ci]" || true
            git push https://$GH_TOKEN@github.com/${{ github.repository }}.git HEAD:${{ github.ref }} || true
            gh workflow run pages.yml --ref main || true
          else
            echo "✅ Aucun fichier rêve à commiter"
          fi
